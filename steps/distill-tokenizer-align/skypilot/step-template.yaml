name: distill-tokenizer-align
version: 1.0.0
# Tokenizer alignment: make a raw Granite base student able to speak the teacher's
# ChatML, and emit the tokenizer artifacts every later distillation step reads.
#
# WHY THIS STEP EXISTS. A Granite directory's tokenizer_config.json declares
# `tokenizer_class: "GPT2Tokenizer"`. AutoTokenizer honours that, constructs that
# class, and the class imposes its own plain ByteLevel pre_tokenizer over the one
# stored in tokenizer.json. Nothing errors — the text simply segments differently
# (26.1 vs 3.29 PPL/token, measured upstream). The 4.1 base student is where this
# bites: its pre_tokenizer is Sequence[Split(regex), ByteLevel] and the override
# discards that Split. Deleting the key is NOT sufficient either — with a
# config.json present, `model_type: granite` resolves through TOKENIZER_MAPPING_NAMES
# to GPT2Tokenizer anyway — so build_overlay PINS it to PreTrainedTokenizerFast.
#
# Division of labour, which is what keeps this step small: the shared distillation
# package does the work (build_overlay, retag_student, align_state, masking). This
# step delivers that package, resolves paths, and forwards eight flags.
#
# Deps come from the image; the CODE comes from a git clone at a pinned SHA (or a
# filesystem checkout — see code_config), so an upstream fix lands without touching
# granite.build. The resolved commit is recorded as step metadata either way.
type: data_processing
config:
  # ─── Source delivery ──────────────────────────────────────────────────────────
  # IDENTICAL IN EVERY PORTED DISTILLATION STEP. The block and the delimited region
  # of `run` below are asserted byte-identical across the ported steps by
  # test/test_source_contract.py — one contract, learned once. Change it here and
  # the other steps' tests fail until they are changed to match.
  code_config:
    # THE DEFAULT: a checkout on the shared filesystem, exactly as gold-distill gets
    # the kd-sandbox trainer from `kd_code_dir`. One pattern in the branch, not two.
    #
    # NO CREDENTIAL REACHES THE CONTAINER on this path, and that is the point. Every
    # other step in this repo either clones nothing or clones a public repo
    # unauthenticated (byoc: "Public repos only"); granite.build's own private-repo
    # access clones SERVER-SIDE on the gbserver host. Shipping a git token into a
    # compute node would be new ground, and the blast radius is not worth it — a
    # token that can read this repo is necessarily broad, because the repo is owned
    # by a personal namespace and a fine-grained PAT cannot scope to it at all.
    #
    # Refresh it in place when the pin below moves; the cluster account has its own
    # GHE key, so cluster-side `git fetch && git checkout <sha>` needs no secret:
    #   git -C /proj/granite-build/g4os/gb-steps-collection-post-training fetch --all
    #   git -C /proj/granite-build/g4os/gb-steps-collection-post-training checkout <sha>
    code_dir: "/proj/granite-build/g4os/gb-steps-collection-post-training"
    # The commit code_dir is EXPECTED to be at. Recorded either way, but when this is
    # set and the checkout is at a different commit the step says so loudly rather
    # than training against whatever happens to be checked out. Empty => no check.
    expect_ref: "70c1550a171aa8e09a9ad9047a5bf763c39e8579"
    # OVERRIDE, for a host with no /proj: clone at run time instead. Used ONLY when
    # code_dir does not resolve. https, because the token path below is https-only.
    repo: ""
    # Branch, tag or commit checked out after that clone. A branch head makes two
    # runs a week apart different runs while reporting the same provenance.
    ref: ""
    # Clone destination, RELATIVE to the step's working directory. On BlueVela the
    # launcher cd's into $GB_BUILD_WORKDIR, which is on /proj — identity-mounted
    # into the container at the same path, so a relative dir is container-visible.
    workdir: "distill-code"
    # The NAME of a space secret holding a read-scoped credential — never a value.
    # Only consulted on the clone path. gbserver merges the space's secrets into the
    # task environment by name (gbserver/environment/skypilot.py:
    # `env.update(self.secrets)`), so the run block reads it as $<this name>;
    # verified on BlueVela. Left EMPTY on purpose: the default path needs no
    # credential. gitstore's own convention for the ssh variant is `GIT_SSH_KEY`
    # (gbserver/asset/gitstore.py), and a read-only deploy key there would be the
    # tightest option if this ever has to be automated.
    token_secret: ""
    # The interpreter. NOT a bare `python`: this image's venv is not on PATH, and a
    # bare python resolves to the system interpreter, which has no transformers.
    python: "/stage/.venv/bin/python"
    # Optional bash run after the source resolves and before the workload, from the
    # step's working directory. Empty => skipped. Not needed on this image: it
    # already carries torch 2.8.0, transformers 5.8.0, tokenizers 0.22.1 and
    # safetensors 0.7.0 (measured, BlueVela job on p6-r17-n3).
    setup_command: ""

  # ─── Alignment ────────────────────────────────────────────────────────────────
  # Small and flat, unlike gold-distill's: there is no dataclass on the other side.
  # run-align.sh takes nine flags and forwards them to entrypoints whose own
  # surfaces are equally small, so the flag-drift problem that forced gold-distill
  # to render a YAML file does not exist here. Flags stay flags.
  align_config:
    # Both are DIRECTORY paths, not HF repo ids: the teacher for this pairing is not
    # publicly fetchable, and a repo id would put a network fetch inside the step.
    #
    # The 4.2 30B teacher. Its tokenizer is the one the student is retagged ONTO.
    teacher_model: ""
    # The RAW 4.1 3B base student — the PRE-retag directory. This is the one
    # directory in the pipeline that genuinely mis-segments, which is exactly why it
    # is this step's input rather than anything downstream's.
    student_model: ""
    # Where the three outputs are written, as out_dir/{teacher_overlay,
    # student_overlay,retagged_student}. Relative values are resolved against
    # $GB_BUILD_WORKDIR. The three are NOT separately configurable: that derivation
    # is also what the GB_ARTIFACT_PATH lines are built from, and a second place to
    # configure it would be a second place for declared and written paths to differ.
    out_dir: "align"
    # The chat template installed on the retagged student. A RELATIVE path is
    # resolved against the delivered checkout, which is where the marked-up template
    # lives — upstream defaults this to an in-image /opt path that does not exist in
    # this image, so the default is repointed rather than inherited.
    #
    # An empty value makes run-align.sh pass --no-chat-template and warn loudly: the
    # student then carries NO template and GOLD training cannot build assistant
    # masks from it. A template WITHOUT {% generation %} markers is worse than none —
    # it makes assistant_masks all-zero, which raises inside the trainer rather than
    # here.
    chat_template: "templates/chatml_granite_42_generation.jinja"
    # copy | symlink | hardlink. `copy` is the only one safe across filesystems; the
    # others exist because a teacher tokenizer.json is 7MB and an overlay sharing
    # inodes with a read-only model store is cheap. Never symlink an overlay a later
    # step might write to.
    copy_mode: "copy"
    # Whether the TEACHER's tokenizer, and the retagged student's, must speak ChatML.
    #
    # Upstream hard-codes this true and it is correct for the reference pair, because
    # granite-4.2 IS a ChatML family. It is a knob because the markup family is a
    # property of the PAIR, not of alignment. granite 4.0 and 4.1 carry
    # <|start_of_role|> / <|end_of_role|> and no <|im_start|> anywhere in
    # added_tokens_decoder, so a granite-4.1 teacher fails stage [1/4] under the
    # upstream default — the run does not start, and the message is about ChatML
    # rather than about the pair.
    #
    # Set false ONLY together with a chat_template of the same family. False with the
    # default ChatML template is the worst of both: alignment succeeds and the teacher
    # then scores a prompt format it has never seen. The marker itself is still
    # checked in that case — stage [4/4] derives the masking contract from the
    # installed template and fails if it cannot.
    require_chatml: true
    # Run verify() on every artifact, plus the post-condition on the retagged
    # student (which asserts ChatML markers only when require_chatml is true; the
    # pre_tokenizer half runs either way). Defaults true and should stay true:
    # verify() is what catches a
    # resolved backend that disagrees with tokenizer.json — the entire failure mode
    # this step exists to prevent — and it is four cheap encoding probes.
    verify: true
    # Resolve and report what would be written, without writing it. Checks a
    # recipe's paths before spending a teacher-sized copy.
    dry_run: false

# ALL THREE artifacts are declared. An undeclared output makes the buildrun resolver
# drop the NEWARTIFACT event, and the target then completes with no output AND no
# error — a silent failure that costs a full training run. Their consumers:
#   retagged_student -> gold-distill's model_name_or_path, and the tokenizer
#                       distill-corpus-prep tokenizes with.
#   teacher_overlay  -> the teacher tokenizer for the eval steps, kept separate from
#                       the teacher MODEL path on purpose.
#   student_overlay  -> distill-corpus-prep's trustworthy comparison point when it
#                       asserts one-tokenizer-per-run. Not consumed by the retag.
outputs:
  required:
    retagged_student:
      type: model
    teacher_overlay:
      type: model
    student_overlay:
      type: model

environment_configs:
  Skypilot:
    # The image is an SM90 (H100) build and the source-delivery contract assumes the
    # LSF provisioner's identity-mounted /proj workdir, so this step is LSF-only.
    subtypes:
      - lsf
    default_launcher: align
    launchers:
      align:
        type: skypilot
        monitors:
          - skypilot_monitor
        config:
          image_id: "docker:us.icr.io/cil15-shared-registry/kd-sandbox-distill:0.1.0-uv"
          # NO GPU is needed: this loads two tokenizers and one embedding matrix on
          # CPU. Node count and any accelerators come from the build.yaml
          # (compute_config / launcher_config.resources) so one step serves both a
          # smoke run and the reference run.
          resources: {}
          # Ships this step's launcher script. A relative dest lands under
          # $GB_BUILD_WORKDIR, which on BlueVela is on /proj — identity-mounted into
          # the container at the same path and exempt from symlink-wrapping.
          file_mounts:
            src: src
          envs:
            # The image is built offline on purpose; keep it that way at run time so
            # a missing local file fails here rather than silently fetching.
            HF_HUB_OFFLINE: "1"
            HF_HOME: /opt/hf-cache
          run: |
            echo "=== distill-tokenizer-align on $(hostname) ==="

            # --- distill source delivery: BEGIN (identical in all ported steps) ---
            # `set -eu` is already in effect: the launcher prefixes it.
            CODE_DIR="{{ config.code_config.code_dir }}"
            REPO="{{ config.code_config.repo }}"
            REF="{{ config.code_config.ref }}"
            PYBIN="{{ config.code_config.python }}"
            WORK="${GB_BUILD_WORKDIR:-$PWD}"

            if [ -n "$CODE_DIR" ] && [ -d "$CODE_DIR/src/gb_steps_post_training" ]; then
              echo "distill: source = filesystem checkout $CODE_DIR"
              CODE_SOURCE="filesystem"
              # A shared checkout is mutable state, so say what is actually there.
              # Uncommitted edits are not fatal — someone may be deliberately testing
              # a fix — but a run whose code came from a dirty tree must not report a
              # bare commit as its provenance.
              DIRTY="$(git -C "$CODE_DIR" status --porcelain 2>/dev/null | wc -l | tr -d ' ')"
              if [ "${DIRTY:-0}" != "0" ]; then
                echo "distill: WARNING: $CODE_DIR has $DIRTY uncommitted change(s)." >&2
                echo "         This run's code is NOT the commit recorded below." >&2
              fi
              echo "GB_STEP_METADATA_KEY:distill_code_dirty GB_STEP_METADATA_VALUE:${DIRTY:-0}"
              # And fail loudly if the checkout is not where the recipe expects. A
              # silently-moved shared checkout is how two runs that report the same
              # pin end up having trained on different code.
              EXPECT_REF="{{ config.code_config.expect_ref }}"
              if [ -n "$EXPECT_REF" ]; then
                AT="$(git -C "$CODE_DIR" rev-parse HEAD 2>/dev/null || true)"
                if [ -n "$AT" ] && [ "$AT" != "$EXPECT_REF" ]; then
                  echo "distill: FATAL: $CODE_DIR is at $AT but code_config.expect_ref" >&2
                  echo "         is $EXPECT_REF. Either check that checkout out to the" >&2
                  echo "         expected commit, or change expect_ref deliberately:" >&2
                  echo "           git -C $CODE_DIR fetch --all" >&2
                  echo "           git -C $CODE_DIR checkout $EXPECT_REF" >&2
                  exit 1
                fi
              fi
            elif [ -n "$REPO" ]; then
              CODE_DIR="$WORK/{{ config.code_config.workdir }}"
              CODE_SOURCE="git"
              TOKEN_VAR="{{ config.code_config.token_secret }}"
              # Indirect expansion, with :- so `set -u` does not abort when the space
              # has no such secret. The dispatcher runs this with `bash <file>`, so
              # bash-isms are available.
              TOKEN="${!TOKEN_VAR:-}"
              echo "distill: source = git clone $REPO (ref=${REF:-<default>}) -> $CODE_DIR"
              rm -rf "$CODE_DIR"
              if [ -n "$TOKEN" ]; then
                # GIT_ASKPASS, not a token in the URL: the URL form puts the secret in
                # argv (readable via /proc on a shared node) and persists it into
                # .git/config on the SHARED filesystem. The helper is written 0700 into
                # the node's own tmp and deleted immediately after use.
                ASKPASS="$(mktemp)"
                cat > "$ASKPASS" <<'ASKPASS_EOF'
            #!/bin/sh
            case "$1" in
              Username*) printf '%s' "x-access-token" ;;
              *)         printf '%s' "$GB_DISTILL_TOKEN" ;;
            esac
            ASKPASS_EOF
                chmod 700 "$ASKPASS"
                CLONE_RC=0
                GB_DISTILL_TOKEN="$TOKEN" GIT_ASKPASS="$ASKPASS" GIT_TERMINAL_PROMPT=0 \
                  git clone --quiet "$REPO" "$CODE_DIR" || CLONE_RC=$?
                rm -f "$ASKPASS"
                if [ "$CLONE_RC" != "0" ]; then
                  echo "distill: FATAL: clone of $REPO failed (rc=$CLONE_RC) using the token in" >&2
                  echo "         \$$TOKEN_VAR. Check that secret's scope, not this step." >&2
                  exit 1
                fi
              else
                echo "distill: FATAL: code_config.repo is set but this space has no secret" >&2
                echo "         named '$TOKEN_VAR'. The upstream repo is PRIVATE, so an" >&2
                echo "         unauthenticated clone cannot succeed. Either create that" >&2
                echo "         secret, or set code_config.code_dir to a checkout and leave" >&2
                echo "         code_config.repo empty." >&2
                exit 1
              fi
              if [ -n "$REF" ]; then
                git -C "$CODE_DIR" checkout --quiet "$REF"
              fi
              if [ ! -d "$CODE_DIR/src/gb_steps_post_training" ]; then
                echo "distill: FATAL: $REPO@${REF:-default} has no src/gb_steps_post_training." >&2
                exit 1
              fi
            else
              echo "distill: FATAL: no source. code_config.code_dir ('$CODE_DIR') does not" >&2
              echo "         contain src/gb_steps_post_training, and code_config.repo is empty." >&2
              exit 1
            fi

            # The package ROOT, not the distillation/ directory: every module is
            # imported by its full dotted path, so a flat path does not resolve. The
            # absence of this export is what killed two upstream jobs at import time.
            export PYTHONPATH="$CODE_DIR/src${PYTHONPATH:+:$PYTHONPATH}"

            # Lineage. A filesystem checkout is mutable and a clone may name a branch,
            # so record the resolved commit either way. NEVER fail the build for
            # metadata — and written as a full if/fi rather than `[ -n "$X" ] && echo`,
            # which under `set -e` aborts the run when X is empty.
            CODE_SHA="$(git -C "$CODE_DIR" rev-parse HEAD 2>/dev/null || true)"
            if [ -n "$CODE_SHA" ]; then
              echo "GB_STEP_METADATA_KEY:distill_code_commit GB_STEP_METADATA_VALUE:$CODE_SHA"
            else
              echo "distill: WARNING: $CODE_DIR is not a git checkout, so this run has no" >&2
              echo "         record of which code ran." >&2
            fi
            echo "GB_STEP_METADATA_KEY:distill_code_source GB_STEP_METADATA_VALUE:$CODE_SOURCE"
            {% if config.code_config.setup_command %}
            echo "distill: running setup_command in $(pwd)"
            {{ config.code_config.setup_command }}
            {% endif %}
            # --- distill source delivery: END ---

            # Absolutise before anything prints a marker: the monitor hands these
            # paths to the env:// store, possibly from another host, so a relative
            # path would be resolved against the wrong directory.
            OUT_DIR="{{ config.align_config.out_dir }}"
            case "$OUT_DIR" in /*) ;; *) OUT_DIR="$WORK/$OUT_DIR" ;; esac

            # A relative chat template is resolved against the delivered checkout,
            # which is where the marked-up template lives.
            CHAT_TEMPLATE="{{ config.align_config.chat_template }}"
            case "$CHAT_TEMPLATE" in
              "" | /*) ;;
              *) CHAT_TEMPLATE="$CODE_DIR/$CHAT_TEMPLATE" ;;
            esac

            PYBIN="$PYBIN" bash ./src/run-align.sh \
              --teacher-model "{{ config.align_config.teacher_model }}" \
              --student-model "{{ config.align_config.student_model }}" \
              --out-dir "$OUT_DIR" \
              --chat-template "$CHAT_TEMPLATE" \
              --copy-mode "{{ config.align_config.copy_mode }}" \
              {% if config.align_config.require_chatml %}--require-chatml{% else %}--no-require-chatml{% endif %} \
              {% if config.align_config.verify %}--verify{% else %}--no-verify{% endif %} \
              {% if config.align_config.dry_run %}--dry-run{% else %}--no-dry-run{% endif %}
    monitors:
      # The shipped monitor library as-is. Inherits the standard artifact convention
      # (GB_ARTIFACT_ID / GB_ARTIFACT_PATH, with binding) and the default poll and
      # log-retrieval profile; a build.yaml's poll_interval_seconds flows through the
      # monitor's own `| default(...)`.
      skypilot_monitor:
        ref: space://monitors/skypilot
