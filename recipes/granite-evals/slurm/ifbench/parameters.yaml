# ifbench on BlueVela (SkyPilot / SLURM), ifbench family image.
# Data: pinned inside the image (GitHub/PyPI/task data baked by images/extras), nothing to fetch.
#
# SMOKE DEFAULTS: LIMIT is small so a first run finishes quickly. Set LIMIT to "" for the full benchmark:
#   gb build start -f recipes/granite-evals/slurm/ifbench/build.yaml --space <space> --param LIMIT=
# Override any value with --param KEY=VALUE.

# ─── Model ────────────────────────────────────────────────────────────
# https://huggingface.co/ibm-granite/granite-4.2-3b (vLLM downloads a hub id into the HF cache).
MODEL_PATH: "ibm-granite/granite-4.2-3b"
SERVED_MODEL_NAME: ""
RUN_NAME: "granite-4.2-3b"
OUTPUT_ROOT: "/proj/granite-build/g4os/granite/runs"
# HF cache the container reads and writes (model + datasets). Empty = the image's /opt/hf-cache.
HF_HOME: ""

# ─── Images (GPU generate + CPU score) ────────────────────────────────────
IMAGE: "us.icr.io/cil15-shared-registry/gb-step-eval-ifbench:1280c95"
IMAGE_CPU: "us.icr.io/cil15-shared-registry/gb-step-eval-ifbench-cpu:1280c95"

# ─── Scale ────────────────────────────────────────────────────────────
LIMIT: "5"
REPEATS: ""
WORKERS: 64
OPTIONS: ""
TENSOR_PARALLEL_SIZE: 1

# ─── Cluster ──────────────────────────────────────────────────────────
ENVIRONMENT_URI: "space://environments/skypilot/slurm/ibm-bluevela"
CLUSTER: "bluevela"
QUEUE: "gpu-mid"
GPU_MEMORY: 256
CPU_QUEUE: "cpu"
SCORE_CPUS: 8
SCORE_MEMORY: 64
MAX_RETRIES: 2
POLL_INTERVAL_SECONDS: 300
LOG_RETRIEVAL_INTERVAL_SECONDS: 300
