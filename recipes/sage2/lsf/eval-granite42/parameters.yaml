# Sage2 Granite 4.2 suite on BlueVela. Override with: gb build start --param KEY=VALUE
#
# Smoke run (a few instances, one repeat):
#   --param SAGE2_LIMIT=5 --param SAGE2_REPEATS=1

# ─── Model ────────────────────────────────────────────────────────────
# A local HF checkpoint dir, or a hub id vLLM downloads into HF_HOME.
MODEL_PATH: "ibm-granite/granite-4.2-3b"
SERVED_MODEL_NAME: ""
RUN_NAME: "granite-4.2-3b"
OUTPUT_ROOT: "/proj/granite-build/g4os/sage2/runs"
HF_HOME: "/proj/granite-build/g4os/sage2/hf-home"

# ─── Images (sage2-evals, `make publish-image EXTRA=<family>`) ────────
SAGE2_IMAGE_SWEBENCH: "icr.io/tir-hew-sage2-evals/sage2-evals-swebench:c3ea588"
SAGE2_IMAGE_TAU: "icr.io/tir-hew-sage2-evals/sage2-evals-tau:1b59d15"

# ─── Scale ────────────────────────────────────────────────────────────
# Empty = full dataset and each benchmark's own repeat count.
SAGE2_LIMIT: ""
SAGE2_REPEATS: ""
TENSOR_PARALLEL_SIZE: 1

# ─── SWE Bench Verified ───────────────────────────────────────────────
SWEBENCH_WORKERS: 8
# Empty = SWE-bench/SWE-bench_Verified at the commit pinned in sage2-evals.
SWEBENCH_DATASET: ""
SWEBENCH_OPTIONS: ""

# ─── tau3-bench (tau3-bench, tau3-airline, tau3-retail, tau3-telecom, tau3-banking-knowledge)
TAU_WORKERS: 16
# Empty = data/tau2 of the tau2-bench commit pinned in sage2-evals (baked into the image).
TAU_DATASET: ""
# The user simulator (and retail's NL judge) default to aws/claude-sonnet-5 on the IBM
# LiteLLM gateway: PAID, needs SAGE2_USER_API_KEY / SAGE2_JUDGE_API_KEY in the job env and
# is metered against SAGE2_SPEND_LEDGER. "user_model=self judge_model=self" = no paid API.
TAU_OPTIONS: ""

# ─── Infrastructure ───────────────────────────────────────────────────
CLUSTER: "bluevela"
QUEUE: "normal"
GPU_MEMORY: 256
POLL_INTERVAL_SECONDS: 300
LOG_RETRIEVAL_INTERVAL_SECONDS: 300
