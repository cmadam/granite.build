granite.build:
  name: sage2-eval-granite42
  # Sage2 Granite 4.2 suite: one target per benchmark, all reading the same checkpoint.
  # Targets are added in suite order as each benchmark lands in sage2-evals; the full
  # list and bring-up status is `sage2-evals list --suite granite42`.
  targets:
    swebench-verified:
      environment_uri: space://environments/skypilot/lsf/ibm-bluevela
      outputs:
        sage2_results:
          uri: "env://{{ binding.path }}"
          type: dataset
      steps:
        - step_uri: space://steps/sage2-swebench-verified
          config:
            poll_interval_seconds: $${POLL_INTERVAL_SECONDS}
            log_retrieval_interval_seconds: $${LOG_RETRIEVAL_INTERVAL_SECONDS}
            sage2_config:
              image: "$${SAGE2_IMAGE_SWEBENCH}"
              model_path: "$${MODEL_PATH}"
              served_model_name: "$${SERVED_MODEL_NAME}"
              output_dir: "$${OUTPUT_ROOT}/$${RUN_NAME}/swebench-verified"
              limit: "$${SAGE2_LIMIT}"
              repeats: "$${SAGE2_REPEATS}"
              workers: "$${SWEBENCH_WORKERS}"
              dataset: "$${SWEBENCH_DATASET}"
              options: "$${SWEBENCH_OPTIONS}"
              tensor_parallel_size: "$${TENSOR_PARALLEL_SIZE}"
              hf_home: "$${HF_HOME}"
            launcher_config:
              resources:
                accelerators: "H100:$${TENSOR_PARALLEL_SIZE}"
                cluster: "$${CLUSTER}"
                zone: "$${QUEUE}"
                memory: $${GPU_MEMORY}
    aime25:
