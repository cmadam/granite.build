granite.build:
  name: g4-350m-sft-ckpt-eval-k8s
  retries:
    max_retries: 2
  targets:
    tokenize:
      environment_uri: "space://environments/{{ space.variables.DEFAULT_ENVIRONMENT\
        \ }}"
      inputs:
        tuning_data:
          uri: "$${TUNING_DATA_URI}"
        model_to_tune:
          uri: "$${MODEL_URI}"
      outputs:
        tokenized_dataset:
          type: "dataset"
          uri: "hf://huggingface.co/datasets/ibm-research/g4-350m-tokenized_{{ run_metadata.targetsteprun_id\
            \ | short_hash }}"
      steps:
      - step_uri: "space://steps/byoi"
        config:
          compute_config:
            num_gpus_per_node: 0
            num_nodes: 1
            total_memory_per_node: "32Gi"
            num_cpus_per_node: 8
          byoi_config:
            command: '/bin/bash -c "chmod +x /tmp/command.sh && /tmp/command.sh"'
          k8s:
            image: "$${SFT_IMAGE}"
            additional_files:
              /tmp/command.sh: |
                set -e
                # HF datasets writes to ~/.cache by default (/.cache, not writable in-pod).
                export HOME=/tmp XDG_CACHE_HOME=/tmp/.cache HF_HOME=/tmp/hf HF_DATASETS_CACHE=/tmp/hf/datasets
                export HF_DATASETS_DISABLE_PROGRESS_BARS=1
                EXP="$${EXPERIMENT}"
                CTX="$${MAX_SEQ_LEN}"
                export FRAC="$${DATA_FRACTION}"
                export SRC="{{ bindings.tuning_data.binding.path }}"
                MODEL="{{ bindings.model_to_tune.binding.path }}"
                WORK="/gb-read-write/outputs/tokenize/${EXP}"
                export IN="${WORK}/input"
                OUT="${WORK}/out"
                TEMPLATE="${WORK}/chat_template.jinja"
                rm -rf "$WORK"; mkdir -p "$IN/general"
                # Granite chat template (merged from the former seed step); Granite-format so
                # run_data_prep_v2.sh's label masking finds the assistant spans.
