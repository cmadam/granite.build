                B64
                # Subsample tulu-3 parquet -> general/data.jsonl (keeps the `messages` schema);
                # stream + islice so we never load the full multi-GB dataset for a smoke run.
                python3 - <<'PY'
                import glob, os, json, itertools, datasets
                import pyarrow.parquet as pq
                src = os.environ["SRC"]; frac = float(os.environ["FRAC"])
                files = sorted(glob.glob(os.path.join(src, "data", "*.parquet")))
                assert files, f"no parquet under {src}/data"
                total = sum(pq.ParquetFile(f).metadata.num_rows for f in files)
                n = max(1, int(total * frac)) if frac <= 1 else int(frac)
                ds = datasets.load_dataset("parquet", data_files=files, split="train", streaming=True)
                out = os.path.join(os.environ["IN"], "general", "data.jsonl")
                with open(out, "w") as fh:
                    for ex in itertools.islice(ds, n):
                        fh.write(json.dumps(ex) + "\n")
                print(f"wrote {n} of {total} examples to {out}")
                import sys; sys.stdout.flush(); os._exit(0)  # avoid pyarrow shutdown abort (exit 134)
                PY
                bash /stage/data_prep/run_data_prep_v2.sh -d "$IN" -t "$TEMPLATE" -s "$OUT" -m "$MODEL" -c "$CTX"
