                  export EXPERIMENT=$${EXPERIMENT}
                  export MODEL_PATH="{{ bindings.model.binding.path }}"
                  export NUM_GPUS=$${EVAL_NUM_GPUS}
                  export MAX_LENGTH=$${MAX_LENGTH}
                  export BATCH_SIZE=$${BATCH_SIZE}
                  mkdir -p ${OUTPUT_BASE_PATH}/$${EXPERIMENT}
                  LOG=${OUTPUT_BASE_PATH}/$${EXPERIMENT}-multilingual-include-european.log
                  bash /workspace/sage/sage/cluster/gb/scripts/multilingual_include_arabic_german_spanish_french.sh 2>&1 | tee "$LOG"
                  echo "LLMB_ARTIFACT_ID:eval_log LLMB_ARTIFACT_PATH:$LOG"
    include-hi-bn-ta-te:
      environment_uri: space://environments/{{ space.variables.DEFAULT_ENVIRONMENT }}
      inputs:
        model: {binding: sft-training.tuned_checkpoint}
      outputs:
        eval_log:
          type: fileset
          uri: lh://{{ space.variables.DEFAULT_LH_ENVIRONMENT }}/{{ space.variables.DEFAULT_LH_NAMESPACE }}/filesets/{{ space.variables.DEFAULT_LH_FILESET_TABLE }}/g4-350m-multilingual-include-south-asian-{{ run_metadata.targetsteprun_id | short_hash }}
      steps:
        - step_uri: space://steps/byoi
          config:
            compute_config:
              num_gpus_per_node: $${EVAL_NUM_GPUS}
              num_nodes: 1
              total_memory_per_node: 96Gi
              num_cpus_per_node: 8
            byoi_config:
              command: '/bin/bash -c "chmod +x /tmp/command.sh && /tmp/command.sh"'
            k8s:
              image: "$${SAGE_MULTILINGUAL_IMAGE}"
              env:
                HF_TOKEN:
                  valueFrom:
                    secretKeyRef:
                      name: "{{ setup_config.space.secret }}"
                      key: "HF_TOKEN"
                OUTPUT_BASE_PATH:
                  value: "/gb-read-write/sage"
                UV_CACHE_DIR:
                  value: "/tmp/uv-cache"
              additional_files:
                "/tmp/command.sh": |
                  set -e
                  export EXPERIMENT=$${EXPERIMENT}
                  export MODEL_PATH="{{ bindings.model.binding.path }}"
                  export NUM_GPUS=$${EVAL_NUM_GPUS}
                  export MAX_LENGTH=$${MAX_LENGTH}
                  export BATCH_SIZE=$${BATCH_SIZE}
                  mkdir -p ${OUTPUT_BASE_PATH}/$${EXPERIMENT}
                  LOG=${OUTPUT_BASE_PATH}/$${EXPERIMENT}-multilingual-include-south-asian.log
                  bash /workspace/sage/sage/cluster/gb/scripts/multilingual_include_hindi_bengali_tamil_telugu.sh 2>&1 | tee "$LOG"
                  echo "LLMB_ARTIFACT_ID:eval_log LLMB_ARTIFACT_PATH:$LOG"
    include-it-ja-ko-nl-pt-zh:
      environment_uri: space://environments/{{ space.variables.DEFAULT_ENVIRONMENT }}
      inputs:
        model: {binding: sft-training.tuned_checkpoint}
      outputs:
        eval_log:
          type: fileset
          uri: lh://{{ space.variables.DEFAULT_LH_ENVIRONMENT }}/{{ space.variables.DEFAULT_LH_NAMESPACE }}/filesets/{{ space.variables.DEFAULT_LH_FILESET_TABLE }}/g4-350m-multilingual-include-cjk-others-{{ run_metadata.targetsteprun_id | short_hash }}
      steps:
        - step_uri: space://steps/byoi
          config:
            compute_config:
              num_gpus_per_node: $${EVAL_NUM_GPUS}
              num_nodes: 1
              total_memory_per_node: 96Gi
              num_cpus_per_node: 8
            byoi_config:
              command: '/bin/bash -c "chmod +x /tmp/command.sh && /tmp/command.sh"'
            k8s:
              image: "$${SAGE_MULTILINGUAL_IMAGE}"
              env:
                HF_TOKEN:
                  valueFrom:
                    secretKeyRef:
                      name: "{{ setup_config.space.secret }}"
                      key: "HF_TOKEN"
                OUTPUT_BASE_PATH:
                  value: "/gb-read-write/sage"
                UV_CACHE_DIR:
                  value: "/tmp/uv-cache"
              additional_files:
                "/tmp/command.sh": |
                  set -e
                  export EXPERIMENT=$${EXPERIMENT}
                  export MODEL_PATH="{{ bindings.model.binding.path }}"
                  export NUM_GPUS=$${EVAL_NUM_GPUS}
                  export MAX_LENGTH=$${MAX_LENGTH}
                  export BATCH_SIZE=$${BATCH_SIZE}
                  mkdir -p ${OUTPUT_BASE_PATH}/$${EXPERIMENT}
                  LOG=${OUTPUT_BASE_PATH}/$${EXPERIMENT}-multilingual-include-cjk-others.log
                  bash /workspace/sage/sage/cluster/gb/scripts/multilingual_include_italian_japanese_korean_dutch_portuguese_chinese.sh 2>&1 | tee "$LOG"
                  echo "LLMB_ARTIFACT_ID:eval_log LLMB_ARTIFACT_PATH:$LOG"
    bfcl:
      environment_uri: space://environments/{{ space.variables.DEFAULT_ENVIRONMENT }}
      inputs:
        model: {binding: sft-training.tuned_checkpoint}
      outputs:
        bfcl_results:
          type: fileset
          uri: lh://{{ space.variables.DEFAULT_LH_ENVIRONMENT }}/{{ space.variables.DEFAULT_LH_NAMESPACE }}/filesets/{{ space.variables.DEFAULT_LH_FILESET_TABLE }}/g4-350m-bfcl-{{ run_metadata.targetsteprun_id | short_hash }}
      steps:
        - step_uri: space://steps/byoi
          config:
            compute_config:
              num_gpus_per_node: $${EVAL_NUM_GPUS}
              num_nodes: 1
              total_memory_per_node: 96Gi
              num_cpus_per_node: 8
            byoi_config:
              command: '/bin/bash -c "chmod +x /tmp/command.sh && /tmp/command.sh"'
            k8s:
              image: "$${BFCL_IMAGE}"
              env:
                HF_TOKEN:
                  valueFrom:
                    secretKeyRef:
                      name: "{{ setup_config.space.secret }}"
                      key: "HF_TOKEN"
                OUTPUT_BASE_PATH:
                  value: "/gb-read-write/sage"
              additional_files:
                "/tmp/command.sh": |
                  set -e
                  unset RANK WORLD_SIZE LOCAL_RANK MASTER_ADDR MASTER_PORT
                  export MODEL_PATH="{{ bindings.model.binding.path }}"
                  export MODEL_ID="$${BFCL_MODEL_ID}"
                  export EXP_NAME="$${EXPERIMENT}"
                  export OUTPUT_DIR="${OUTPUT_BASE_PATH}/$${EXPERIMENT}/$${BFCL_EVAL_NAME}"
                  export TEST_CATEGORIES="$${BFCL_TEST_CATEGORIES}"
                  export NUM_GPUS_GENERATE=$${EVAL_NUM_GPUS}
                  export NUM_GPUS_EVALUATE=$${EVAL_NUM_GPUS}
                  export GPU_MEMORY_UTILIZATION="0.5"
                  export VLLM_PORT=$(python3 -c "import socket; s=socket.socket(); s.bind(('',0)); print(s.getsockname()[1]); s.close()")
                  export VLLM_WORKER_MULTIPROC_METHOD=spawn
                  export VLLM_SKIP_P2P_CHECK=1
                  export NCCL_IGNORE_DISABLED_P2P=1
                  export PYTHONUNBUFFERED=1
                  mkdir -p "$OUTPUT_DIR"
                  bash /workspace/scripts/run-bfcl.sh 2>&1 | tee "${OUTPUT_DIR}/${EXP_NAME}-bfcl.log"
                  RESULT_FILE=$(find "$OUTPUT_DIR" -type f \( -name '*score*.json' -o -name '*summary*.json' -o -name 'BFCL_*.json' \) -printf '%T@ %p\n' | sort -nr | awk 'NR==1{print $2}')
                  if [ -z "$RESULT_FILE" ]; then echo "ERROR: no BFCL result json in $OUTPUT_DIR"; find "$OUTPUT_DIR" -maxdepth 2 -type f | head -20; exit 1; fi
                  echo "LLMB_ARTIFACT_ID:bfcl_results LLMB_ARTIFACT_PATH:${RESULT_FILE}"
    # ─── Result exporter (runs after all evals via wait_for_push) ─────────────
    export-results:
      environment_uri: space://environments/{{ space.variables.DEFAULT_ENVIRONMENT }}
      inputs:
        wait_global_mmlu: {binding: global-mmlu.eval_log, wait_for_push: true}
        wait_mgsm: {binding: mgsm.eval_log, wait_for_push: true}
        wait_include_ar_de_es_fr: {binding: include-ar-de-es-fr.eval_log, wait_for_push: true}
        wait_include_hi_bn_ta_te: {binding: include-hi-bn-ta-te.eval_log, wait_for_push: true}
        wait_include_it_ja_ko_nl_pt_zh: {binding: include-it-ja-ko-nl-pt-zh.eval_log, wait_for_push: true}
        wait_bfcl: {binding: bfcl.bfcl_results, wait_for_push: true}
      outputs:
        results:
          type: fileset
          uri: lh://{{ space.variables.DEFAULT_LH_ENVIRONMENT }}/{{ space.variables.DEFAULT_LH_NAMESPACE }}/filesets/{{ space.variables.DEFAULT_LH_FILESET_TABLE }}/g4-350m-eval-results-{{ run_metadata.targetsteprun_id | short_hash }}
      steps:
        - step_uri: space://steps/byoi
          config:
            compute_config:
              num_gpus_per_node: 0
              num_nodes: 1
              total_memory_per_node: 10Gi
              num_cpus_per_node: 1
            byoi_config:
              command: '/bin/bash -c "chmod +x /tmp/command.sh && /tmp/command.sh"'
            k8s:
              image: "$${SAGE_OLMES_IMAGE}"
              env:
                OUTPUT_BASE_PATH:
                  value: "/gb-read-write/sage"
              additional_files:
                "/tmp/command.sh": |
                  set -e
                  cd /workspace/sage/sage/exporters/
                  python exporter.py -in-folder ${OUTPUT_BASE_PATH}/$${EXPERIMENT} -stack granite4-instruct -o ${OUTPUT_BASE_PATH}/$${EXPERIMENT}/$${EXPERIMENT}.csv
                  echo "LLMB_ARTIFACT_ID:results LLMB_ARTIFACT_PATH:${OUTPUT_BASE_PATH}/$${EXPERIMENT}"
