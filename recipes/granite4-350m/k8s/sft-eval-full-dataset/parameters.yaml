# Default parameters for the granite4-350m full-dataset SFT + full-eval build on a
# native Granite.build Kubernetes environment (type: K8s, helm launchers).
#
# Training runs space://steps/open-instruct as a FULL fine-tune (no LoRA, no merge
# step) on a HuggingFace base model + HF SFT dataset, and pushes the checkpoint to
# HuggingFace. Evals run space://steps/byoi against the trained checkpoint, using
# the per-category SAGE images (the SAGE repo is baked into each image).
#
# Override any value with: gb build start --param KEY=VALUE
# Run with:
#   gb build start \
#     -f recipes/granite4-350m/k8s/sft-eval-full-dataset/build.yaml \
#     --parameters-path recipes/granite4-350m/k8s/sft-eval-full-dataset/parameters.yaml \
#     --space <your-k8s-space>

# ─── Base model + training data (HuggingFace artifacts) ─────────────────────
MODEL_URI: "hf://huggingface.co/models/ibm-granite/granite-4.0-350m-base"
# Raw (untokenized) chat SFT dataset. The `tokenize` target pre-tokenizes it with
# run_data_prep_v2.sh (Granite template) and sft-training consumes --tokenized_data;
# open-instruct's on-the-fly loader can't ingest tulu-3's multi-turn `messages`.
TUNING_DATA_URI: "hf://huggingface.co/datasets/allenai/tulu-3-sft-mixture"
# Fraction of the dataset to tokenize/train on (1.0 = full). NOTE: at 1.0 the tokenize
# step processes all ~939k examples on a CPU pod — heavy/slow; bump the tokenize
# target's cpu/memory if needed, or lower this for a partial run.
DATA_FRACTION: "1.0"

# ─── Training image (pinned — matches BlueVela) ─────────────────────────────
SFT_IMAGE: "us.icr.io/cil15-shared-registry/open-instruct-tuning:0.1.0-conda"

# ─── SFT hyperparameters ────────────────────────────────────────────────────
NUM_EPOCHS: 2
PER_DEVICE_BATCH_SIZE: "4"
GRADIENT_ACCUMULATION_STEPS: "2"
LEARNING_RATE: "1e-5"
LR_SCHEDULER_TYPE: "linear"
WARMUP_RATIO: "0.03"
WEIGHT_DECAY: "0.0"
CLIP_GRAD_NORM: "1.0"
MAX_SEQ_LEN: 8192
SEED: 123
REDUCE_LOSS: "sum"
CHECKPOINTING_STEPS: "epoch"
KEEP_LAST_N_CHECKPOINTS: "5"
# Set larger than the run's total optimization steps so the per-step logging block
# never fires: the pinned open-instruct image's finetune.py bugs out there
# (accelerator.reduce(total_grad_norm_sq) is passed a float, which this accelerate
# version rejects), crashing training at the first logging step. NOTE: "0" does NOT
# work — falsy values are dropped in the config merge and fall back to the default.
# For a real full run you likely want metrics; that needs a fixed image, after which
# this can go back to e.g. "10". Tune above your expected step count if training long.
LOGGING_STEPS: "1000000"
# NOTE: CHAT_TEMPLATE_NAME is no longer consumed — the recipe pre-tokenizes with the
# Granite template in the `tokenize` target and trains via --tokenized_data. Kept for
# reference; the sft-training step no longer passes chat_template_name.
CHAT_TEMPLATE_NAME: "granite3dot1wodefaultsysmsg"

# ─── Compute ────────────────────────────────────────────────────────────────
SFT_NUM_GPUS: 8
SFT_NUM_NODES: 1
EVAL_NUM_GPUS: 1

# ─── Eval settings (consumed by the byoi SAGE targets) ──────────────────────
EXPERIMENT: "g4-350m-sft-eval-full"
BATCH_SIZE: "10"
MAX_LENGTH: "4096"

# ─── Per-category SAGE images (the SAGE repo is baked into each; the byoi step
# runs sage/cluster/gb/scripts/<benchmark>.sh directly). Category → image is set
# per target in build.yaml, transcribed from eval-catalog.yaml image_id. ───────
SAGE_OLMES_IMAGE: "us.icr.io/cil15-shared-registry/sage-py311-olmes:0.025"
SAGE_CODE_IMAGE: "us.icr.io/cil15-shared-registry/sage-py311-code:0.025"
SAGE_SAFETY_IMAGE: "us.icr.io/cil15-shared-registry/sage-py311-safety:0.025"
SAGE_MULTILINGUAL_IMAGE: "us.icr.io/cil15-shared-registry/sage-py311-multilingual:0.025"

# BigCodeBench external evaluation API (consumed by olmes-bigcodebench).
OE_EVAL_BCB_API_URL: "http://bigcodebench-server:7860/evaluate/"

# ─── BFCL (function-calling eval — byoi with the bfcl image) ────────────────
# Command transcribed from the bluevela bfcl-eval step (runs run-bfcl.sh).
BFCL_IMAGE: "us.icr.io/cil15-shared-registry/bfcl-py311:0.02"
BFCL_MODEL_ID: "ibm-granite/granite-4"
BFCL_EVAL_NAME: "bfclv3"
BFCL_TEST_CATEGORIES: "all"
