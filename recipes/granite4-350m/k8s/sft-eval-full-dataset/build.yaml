                  if [ ! -d "$FINAL" ]; then echo "ERROR: tokenized dataset not found at $FINAL"; find "$OUT" -maxdepth 4 -type d; exit 1; fi
                  # Emit the tokenized dataset dir as the artifact; gbserver's hfpush
                  # upload_folders it to the HF repo, and sft-training pulls it back.
                  echo "tokenized dataset ready at $FINAL"
                  echo "LLMB_ARTIFACT_ID:tokenized_dataset LLMB_ARTIFACT_PATH:${FINAL}"
    # ─── SFT training (full fine-tune) ───────────────────────────────────────
    sft-training:
      environment_uri: space://environments/{{ space.variables.DEFAULT_ENVIRONMENT }}
      inputs:
        model_to_tune:
          uri: "$${MODEL_URI}"
        tokenized_dataset:
          binding: tokenize.tokenized_dataset
          wait_for_push: true
      outputs:
        tuned_checkpoint:
          type: model
          uri: hf://huggingface.co/datasets/ibm-research/g4-350m-sft_{{ run_metadata.targetsteprun_id | short_hash }}_{{ binding.path | path_basename }}
      steps:
        # Forked open-instruct step: narrows the tuned_checkpoint log_monitor
        # regex to the final HF checkpoint (…epoch_hf…) so it fires once, not
        # twice. Override lives in cmadam/assets@gbspace-config-dev; everything
        # else still resolves from the registered space.
        - step_uri: git+ssh://github.ibm.com/cmadam/assets.git@gbspace-config-dev#subdirectory=steps/open-instruct
          config:
            k8s:
              image: "$${SFT_IMAGE}"
              env:
                HF_TOKEN:
                  valueFrom:
                    secretKeyRef:
                      name: "{{ setup_config.space.secret }}"
                      key: "HF_TOKEN"
                # GPU P2P is disabled/broken on these nodes (the bfcl eval step sets
                # VLLM_SKIP_P2P_CHECK / NCCL_IGNORE_DISABLED_P2P). Without the training-side
                # equivalent, DeepSpeed ZeRO-3's first reduce_scatter dies with an
                # "unhandled cuda error". Force NCCL off P2P (use shared memory instead).
                NCCL_P2P_DISABLE:
                  value: "1"
                NCCL_DEBUG:
                  value: "WARN"
            tuning_config:
              # Pre-tokenized dataset produced by `tokenize`, pushed to HF and pulled back
              # here (binding.path = local download dir); load_from_disk-compatible, so this
              # bypasses open-instruct's raw-data loader entirely.
              tokenized_data: "{{ bindings.tokenized_dataset.binding.path }}"
              # Granite chat template — applied to the tokenizer so that
              # save_pretrained() bakes it into tokenizer_config.json; evals
              # need it for apply_chat_template(). The base model ships without one.
              chat_template_name: "$${CHAT_TEMPLATE_NAME}"
              # Destination for the HF-converted checkpoint. The k8s open-instruct step
              # (unlike the LSF one) never sets --hf_dir, so at epoch end the HF conversion
              # does os.path.join(args.hf_dir, ...) with hf_dir=None → TypeError. Set it to a
              # writable PVC path; finetune writes <hf_dir>/epoch_hf_<N>, which the step
              # scrapes ("tokenizer config file saved in …") to produce the tuned_checkpoint.
              hf_dir: "/gb-read-write/outputs/open-instruct/hf/g4-350m-sft-{{ run_metadata.targetsteprun_id | short_hash }}"
              use_flash_attn: true
              gradient_checkpointing: true
              num_train_epochs: $${NUM_EPOCHS}
              per_device_train_batch_size: "$${PER_DEVICE_BATCH_SIZE}"
              gradient_accumulation_steps: "$${GRADIENT_ACCUMULATION_STEPS}"
              learning_rate: "$${LEARNING_RATE}"
              lr_scheduler_type: "$${LR_SCHEDULER_TYPE}"
              warmup_ratio: "$${WARMUP_RATIO}"
              weight_decay: "$${WEIGHT_DECAY}"
              clip_grad_norm: "$${CLIP_GRAD_NORM}"
              max_seq_length: $${MAX_SEQ_LEN}
              seed: $${SEED}
              reduce_loss: "$${REDUCE_LOSS}"
              checkpointing_steps: "$${CHECKPOINTING_STEPS}"
              keep_last_n_checkpoints: "$${KEEP_LAST_N_CHECKPOINTS}"
              logging_steps: "$${LOGGING_STEPS}"
            compute_config:
              num_gpus_per_node: $${SFT_NUM_GPUS}
              num_nodes: $${SFT_NUM_NODES}
