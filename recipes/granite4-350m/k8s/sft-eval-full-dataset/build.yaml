######
# granite4-350m — full-dataset SFT (full fine-tune) + full 27-eval suite on a
# native Granite.build Kubernetes environment (type: K8s).
#
# Training: space://steps/open-instruct (pinned BlueVela image), HF base model +
#   HF SFT dataset, checkpoint pushed to HF.
# Evals: space://steps/byoi — the SAGE repo is baked into per-category images
#   (see eval-catalog.yaml image_id); each eval runs the gb_script directly and
#   tees a log. bfcl runs run-bfcl.sh in the bfcl image. An export-results target
#   rolls the shared results dir up to hf:// after every eval (wait_for_push).
#
# Run:
#   gb build start -f recipes/granite4-350m/k8s/sft-eval-full-dataset/build.yaml \
#     --parameters-path recipes/granite4-350m/k8s/sft-eval-full-dataset/parameters.yaml \
#     --space <your-k8s-space>
######
granite.build:
  name: g4-350m-sft-eval-full-k8s
  retries:
    max_retries: 5
  targets:
    # ─── Tokenize tulu-3 with the Granite template (CPU) → --tokenized_data ───
    # Merged seed+tokenize: decode the embedded Granite template, subsample tulu-3,
    # and pre-tokenize with run_data_prep_v2.sh (the pinned open-instruct image's
    # raw-data loader can't ingest tulu-3's multi-turn `messages`). The tokenized
    # dataset is written to a fixed PVC path that sft-training reads via
    # --tokenized_data; only a tiny lh:// 'ready' marker is emitted for ordering
    # (env:///file:// aren't supported stores on the k8s environment).
    tokenize:
      environment_uri: space://environments/{{ space.variables.DEFAULT_ENVIRONMENT }}
      inputs:
        tuning_data:
          uri: "$${TUNING_DATA_URI}"
        model_to_tune:
          uri: "$${MODEL_URI}"
      outputs:
        # Push the tokenized dataset dir to HF (upload_folder → verbatim, preserves the
        # save_to_disk layout). sft-training pulls it back and load_from_disk's it.
        # lh:// was Forbidden (no lakehouse write perms); env://file:// aren't configured.
        tokenized_dataset:
          type: dataset
          uri: hf://huggingface.co/datasets/ibm-research/g4-350m-tokenized_{{ run_metadata.targetsteprun_id | short_hash }}
      steps:
        - step_uri: space://steps/byoi
          config:
            compute_config:
              num_gpus_per_node: 0
              num_nodes: 1
              total_memory_per_node: 32Gi
              num_cpus_per_node: 8
            byoi_config:
              command: '/bin/bash -c "chmod +x /tmp/command.sh && /tmp/command.sh"'
            k8s:
              image: "$${SFT_IMAGE}"   # open-instruct image ships /stage/data_prep + base64
              additional_files:
                "/tmp/command.sh": |
                  set -e
                  # HF datasets writes to ~/.cache by default (/.cache, not writable in-pod).
                  export HOME=/tmp XDG_CACHE_HOME=/tmp/.cache HF_HOME=/tmp/hf HF_DATASETS_CACHE=/tmp/hf/datasets
                  export HF_DATASETS_DISABLE_PROGRESS_BARS=1
                  EXP="$${EXPERIMENT}"
                  CTX="$${MAX_SEQ_LEN}"
                  export FRAC="$${DATA_FRACTION}"
                  export SRC="{{ bindings.tuning_data.binding.path }}"
                  MODEL="{{ bindings.model_to_tune.binding.path }}"
                  WORK="/gb-read-write/outputs/tokenize/${EXP}"
                  export IN="${WORK}/input"
                  OUT="${WORK}/out"
                  TEMPLATE="${WORK}/chat_template.jinja"
                  rm -rf "$WORK"; mkdir -p "$IN/general"
