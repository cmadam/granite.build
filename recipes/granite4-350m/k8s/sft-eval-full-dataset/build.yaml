                  LOG=${OUTPUT_BASE_PATH}/$${EXPERIMENT}-multilingual-include-cjk-others.log
                  bash /workspace/sage/sage/cluster/gb/scripts/multilingual_include_italian_japanese_korean_dutch_portuguese_chinese.sh 2>&1 | tee "$LOG"
                  echo "LLMB_ARTIFACT_ID:eval_log LLMB_ARTIFACT_PATH:$LOG"
    bfcl:
      environment_uri: space://environments/{{ space.variables.DEFAULT_ENVIRONMENT }}
      inputs:
        model: {binding: sft-training.tuned_checkpoint}
      outputs:
        bfcl_results:
          type: fileset
          uri: hf://huggingface.co/datasets/ibm-research/g4-350m-bfcl-{{ run_metadata.targetsteprun_id | short_hash }}
      steps:
        - step_uri: space://steps/byoi
          config:
            compute_config:
              num_gpus_per_node: $${EVAL_NUM_GPUS}
              num_nodes: 1
              total_memory_per_node: 96Gi
              num_cpus_per_node: 8
            byoi_config:
              command: '/bin/bash -c "chmod +x /tmp/command.sh && /tmp/command.sh"'
            k8s:
              image: "$${BFCL_IMAGE}"
              env:
                HF_TOKEN:
                  valueFrom:
                    secretKeyRef:
                      name: "{{ setup_config.space.secret }}"
                      key: "HF_TOKEN"
                OUTPUT_BASE_PATH:
                  value: "/gb-read-write/sage"
              additional_files:
                "/tmp/command.sh": |
                  set -e
                  unset RANK WORLD_SIZE LOCAL_RANK MASTER_ADDR MASTER_PORT
                  export MODEL_PATH="{{ bindings.model.binding.path }}"
                  export MODEL_ID="$${BFCL_MODEL_ID}"
                  export EXP_NAME="$${EXPERIMENT}"
                  export OUTPUT_DIR="${OUTPUT_BASE_PATH}/$${EXPERIMENT}/$${BFCL_EVAL_NAME}"
                  export TEST_CATEGORIES="$${BFCL_TEST_CATEGORIES}"
                  export NUM_GPUS_GENERATE=$${EVAL_NUM_GPUS}
                  export NUM_GPUS_EVALUATE=$${EVAL_NUM_GPUS}
                  export GPU_MEMORY_UTILIZATION="0.5"
                  export VLLM_PORT=$(python3 -c "import socket; s=socket.socket(); s.bind(('',0)); print(s.getsockname()[1]); s.close()")
                  export VLLM_WORKER_MULTIPROC_METHOD=spawn
                  export VLLM_SKIP_P2P_CHECK=1
                  export NCCL_IGNORE_DISABLED_P2P=1
                  export PYTHONUNBUFFERED=1
                  mkdir -p "$OUTPUT_DIR"
                  bash /workspace/scripts/run-bfcl.sh 2>&1 | tee "${OUTPUT_DIR}/${EXP_NAME}-bfcl.log"
                  RESULT_FILE=$(find "$OUTPUT_DIR" -type f \( -name '*score*.json' -o -name '*summary*.json' -o -name 'BFCL_*.json' \) -printf '%T@ %p\n' | sort -nr | awk 'NR==1{print $2}')
                  if [ -z "$RESULT_FILE" ]; then echo "ERROR: no BFCL result json in $OUTPUT_DIR"; find "$OUTPUT_DIR" -maxdepth 2 -type f | head -20; exit 1; fi
                  echo "LLMB_ARTIFACT_ID:bfcl_results LLMB_ARTIFACT_PATH:${RESULT_FILE}"
    # ─── Result exporter (runs after all evals via wait_for_push) ─────────────
    export-results:
      environment_uri: space://environments/{{ space.variables.DEFAULT_ENVIRONMENT }}
      inputs:
        wait_olmes_cruxeval: {binding: olmes-cruxeval.eval_log, wait_for_push: true}
        wait_olmes_bigcodebench: {binding: olmes-bigcodebench.eval_log, wait_for_push: true}
        wait_evalplus_humaneval: {binding: evalplus-humaneval.eval_log, wait_for_push: true}
        wait_evalplus_mbpp: {binding: evalplus-mbpp.eval_log, wait_for_push: true}
        wait_multiple_sh: {binding: multiple-sh.eval_log, wait_for_push: true}
        wait_multiple_cpp: {binding: multiple-cpp.eval_log, wait_for_push: true}
        wait_multiple_java: {binding: multiple-java.eval_log, wait_for_push: true}
        wait_multiple_js: {binding: multiple-js.eval_log, wait_for_push: true}
        wait_multiple_rs: {binding: multiple-rs.eval_log, wait_for_push: true}
        wait_olmes_agi_eval: {binding: olmes-agi-eval.eval_log, wait_for_push: true}
        wait_olmes_bbh: {binding: olmes-bbh.eval_log, wait_for_push: true}
        wait_olmes_mmlu_pro: {binding: olmes-mmlu-pro.eval_log, wait_for_push: true}
        wait_olmes_ifeval: {binding: olmes-ifeval.eval_log, wait_for_push: true}
        wait_olmes_mmlu_mc: {binding: olmes-mmlu-mc.eval_log, wait_for_push: true}
        wait_olmes_deepmind_math: {binding: olmes-deepmind-math.eval_log, wait_for_push: true}
        wait_olmes_gpqa: {binding: olmes-gpqa.eval_log, wait_for_push: true}
        wait_olmes_gsm8k: {binding: olmes-gsm8k.eval_log, wait_for_push: true}
        wait_olmes_gsm_symbolic: {binding: olmes-gsm-symbolic.eval_log, wait_for_push: true}
        wait_olmes_minerva_math: {binding: olmes-minerva-math.eval_log, wait_for_push: true}
        wait_attaq: {binding: attaq.eval_log, wait_for_push: true}
        wait_salad_bench: {binding: salad-bench.eval_log, wait_for_push: true}
        wait_global_mmlu: {binding: global-mmlu.eval_log, wait_for_push: true}
        wait_mgsm: {binding: mgsm.eval_log, wait_for_push: true}
        wait_include_ar_de_es_fr: {binding: include-ar-de-es-fr.eval_log, wait_for_push: true}
        wait_include_hi_bn_ta_te: {binding: include-hi-bn-ta-te.eval_log, wait_for_push: true}
        wait_include_it_ja_ko_nl_pt_zh: {binding: include-it-ja-ko-nl-pt-zh.eval_log, wait_for_push: true}
        wait_bfcl: {binding: bfcl.bfcl_results, wait_for_push: true}
      outputs:
        results:
          type: fileset
          uri: hf://huggingface.co/datasets/ibm-research/g4-350m-eval-results-{{ run_metadata.targetsteprun_id | short_hash }}
      steps:
        - step_uri: space://steps/byoi
          config:
            compute_config:
              num_gpus_per_node: 0
              num_nodes: 1
              total_memory_per_node: 10Gi
              num_cpus_per_node: 1
            byoi_config:
              command: '/bin/bash -c "chmod +x /tmp/command.sh && /tmp/command.sh"'
            k8s:
              image: "$${SAGE_OLMES_IMAGE}"
              env:
                OUTPUT_BASE_PATH:
                  value: "/gb-read-write/sage"
              additional_files:
                "/tmp/command.sh": |
                  set -e
                  cd /workspace/sage/sage/exporters/
                  python exporter.py -in-folder ${OUTPUT_BASE_PATH}/$${EXPERIMENT} -stack granite4-instruct -o ${OUTPUT_BASE_PATH}/$${EXPERIMENT}/$${EXPERIMENT}.csv
                  # Redact HF tokens from SAGE-generated scripts before hfpush;
                  # HuggingFace rejects commits containing valid hf_* secrets.
                  find ${OUTPUT_BASE_PATH}/$${EXPERIMENT} -name "*.sh" -exec sed -i 's/hf_[A-Za-z0-9]\{10,\}/REDACTED/g' {} +
                  echo "LLMB_ARTIFACT_ID:results LLMB_ARTIFACT_PATH:${OUTPUT_BASE_PATH}/$${EXPERIMENT}"
