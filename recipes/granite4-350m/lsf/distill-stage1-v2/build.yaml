######
# distill-stage1-v2 — off-policy GOLD for the granite4-350m pair, anchored,
# instrumented, and bounded by steps rather than by an epoch. BlueVela (SkyPilot / LSF).
#
# WHY THERE IS A V2
#
# distill-stage1 ran as build df8512e0: 8,150 steps, 13h20 on 2x8 H100, every step
# exit 0, and a model worse on every one of the 30+ benchmarks measured. HumanEval
# 40.85 -> 0.61. MultiPL-E Java 21.05 -> 0.00. MGSM 17.60 -> 0.08. Nothing was broken:
# the objective did what it was told, for far too long, with nothing watching.
#
# GOLD's loss IS the divergence — no term measures the student against the corpus
# tokens. The student was already two epochs of SFT into this corpus family, so it
# began 12% of the way from the teacher (JSD 0.0825 against a ln2 = 0.693 ceiling) and
# had banked ~68% of the realisable gain by step 509. For the remaining 7,640 steps the
# only descent direction left was to become more certain, so it did: student entropy
# fell 42% (0.684 -> 0.396 nats, effective branching factor 1.49), reverse KL moved
# 1.8% while forward KL improved 36%, and the generations became repetition loops
# (back-to-back repetition 0.4% -> 20.8% on Java). The train loss moved 2.7% across
# those steps and reported none of it. save_total_limit 3 then deleted every checkpoint
# from before the collapse, so nothing was recoverable and stage 1 had to be retrained.
#
# FOUR CHANGES, EACH AIMED AT ONE PART OF THAT
#
#   1. CE_COEF adds cross entropy on the corpus tokens to the divergence, so drifting
#      away from real text costs something and "become more confident" stops being a
#      free win. Needs the patched trainer — see KD_CODE_DIR in parameters.yaml.
#   2. LOG_STUDENT_ENTROPY logs entropy and reverse KL every step, and
#      ENTROPY_GUARD_DROP_FRAC stops the run when entropy falls 15% below its own
#      baseline. At that threshold df8512e0 would have stopped inside the first hour
#      instead of after 13 hours plus a full eval sweep.
#   3. GOLD_MAX_STEPS 2000 sizes the horizon to the headroom that actually existed,
#      rather than to one epoch of the corpus.
#   4. GOLD_SAVE_STEPS 250 with GOLD_SAVE_TOTAL_LIMIT 16 keeps every checkpoint, so a
#      collapse can be bisected instead of retrained.
#
# TWO ARMS, ONE RECIPE
#
# Run it twice. Once as shipped (CE_COEF 0.05, guard armed) and once as a control with
# --param CE_COEF=0 --param ENTROPY_GUARD_DROP_FRAC=0 --param RUN_NAME=<other>. Without
# the control a better result is ambiguous between "the anchor worked" and "2,000 steps
# instead of 8,150 worked", and df8512e0 cannot serve as that control: it kept no
# checkpoint below step 7750 and evaluated nothing in between. The control's guard is
# OFF deliberately, so it runs the full 2,000 steps and the two arms are comparable at
# matched steps rather than one being cut short.
#
# THE CHECKPOINT LADDER
#
# CKPT_LADDER drives a Jinja loop that emits one export and one eval-transfer target
# per checkpoint, so the curve is measured rather than just its endpoint. A fifth
# target, gen-smoke, greedily generates from every export and reports back-to-back
# repetition — the cheap read that would have caught df8512e0 before ~4 GPU-h went into
# confirming it. full-eval is NOT wired in here: it is ~4 GPU-h per model and needs
# bcb-server up, so it is launched per checkpoint afterwards, gated on what
# eval-transfer and gen-smoke say. See the README.
#
# The loop variable interpolates through the CLI's own marker syntax, the same form
# every parameter here uses -- NOT through a doubled curly brace, which is left alone
# for the SERVER to resolve as a binding. Getting that backwards yields a target
# literally named export- followed by the unexpanded braces.
#
# Note also that a marker inside a COMMENT is still rendered: the CLI templates this
# file in full, comments included, and a loop variable named outside its loop is an
# undefined-variable error that fails the build before submission. Hence the bare
# names throughout these comments.
#
# Everything before train-gold — sources, align, corpus, and the INCLUDE_SFT switch —
# is distill-stage1 unchanged, including the edges and the reasons for them:
#
#   align  -> corpus   the corpus must be measured with the tokenizer that will train.
#   align  -> train    the student is the RETAGGED student, not the raw checkpoint.
#   corpus -> train    plus the manifest the trainer's row-count guard reads.
#   train  -> export-N selects checkpoint-N and makes it HF-native.
#   export -> eval-*   every post-training read measures an exported model.
#   align  -> eval-transfer-baseline   the t=0 read, which is what gives the
#                      post-training numbers a direction.
#
# The SFT arm stays OFF. The student already IS an SFT checkpoint — two epochs of it —
# and its eval row is the baseline this work is measured against, so re-running SFT
# would replace the control with a different model.
#
# Values come from parameters.yaml beside this file; the comments explaining WHY each
# value is what it is live there.
#
# Run (parameters.yaml is picked up automatically because it sits next to this file):
#   gb build start -f recipes/granite4-350m/lsf/distill-stage1-v2/build.yaml --space <space>
######
granite.build:
  name: distill-350m-stage1-v2
  # A retry is here because of a MEASURED cluster fault, not as general
  # insurance. Builds 7853d33b and b5f030cd lost three GPU targets to
  # `RuntimeError: CUDA unknown error` raised inside torch at cuda_init, every
  # one of them on host p2-r03-n1 — 3 runs, 3 failures on that host, against 0
  # failures across several hundred runs on every other host in the logs. The
  # node takes the allocation and cannot initialise CUDA.
  #
  # Nothing in a build.yaml can steer LSF away from a host (see README for the
  # bsub exclusion, which lives in ~/.sky/config.yaml), so the recipe's only
  # lever is to run the target again and land somewhere else. target_reuse_enabled
  # means a retry re-runs the FAILED target and reuses what already succeeded, so
  # a fault three targets deep does not re-train.
  retries:
    max_retries: $${MAX_RETRIES}
    target_reuse_enabled: true
  targets:

<% if not CORPUS_DIR | string | trim %>
    # Skipped entirely when CORPUS_DIR is set -- see parameters.yaml.
    # ─── sources ────────────────────────────────────────────────────────────
    # Build ONE corpus file from the three SFT splits, because three things are
    # true at once and no single one of them is optional:
    #
    #   1. prep takes ONE path. prep_corpus.py:294 refuses a directory outright --
    #      "Pass the .jsonl itself, or an HF dataset id" -- so there is no glob and
    #      no list form to hand it three files with.
    #
    #   2. THE ROWS ARE SPELLED `conversations`, NOT `messages`. prep reads
    #      record.get("messages") (prep_corpus.py:367) and returns `no_messages`
    #      otherwise. Handed these files unchanged it would drop all 5,081,504 rows
    #      and raise PrepError. This rename is the single most load-bearing line in
    #      the target.
    #
    #   3. The splits are wildly unequal -- general 84.86%, tools 13.98%, rag 1.17%
    #      -- and prep's max_examples stops after N KEPT rows IN INPUT ORDER. A
    #      plain concatenation plus max_examples would therefore yield a subset of
    #      pure `general` with no tools and no rag in it, silently. Sampling
    #      proportionally HERE, and shuffling, is what makes a subset representative
    #      rather than just short.
    #
    # Reservoir sampling per split, seeded, so the selection is reproducible from
    # SHUFFLE_SEED alone and memory is bounded by the sample rather than the corpus.
    # Two passes: one to count, one to select, because the per-split quota cannot be
    # computed until the totals are known.
    sources:
      environment_uri: space://environments/skypilot/lsf/ibm-bluevela
      inputs:
        # Lineage. Three declared inputs mean the corpus's provenance is recorded as
        # three artifacts rather than as a path inside a shell script.
        source_general:
          uri: "env://$${SOURCE_GENERAL}"
          type: dataset
        source_tools:
          uri: "env://$${SOURCE_TOOLS}"
          type: dataset
        source_rag:
          uri: "env://$${SOURCE_RAG}"
          type: dataset
      outputs:
        corpus_source:
          uri: "env://{{ binding.path }}"
          type: dataset
      steps:
        - step_uri: space://steps/command
          config:
            poll_interval_seconds: $${POLL_INTERVAL_SECONDS}
            log_retrieval_interval_seconds: $${LOG_RETRIEVAL_INTERVAL_SECONDS}
            compute_config:
              num_nodes: 1
              num_cpus_per_node: $${SOURCES_CPUS}
            launcher_config:
              image_id: "$${IMAGE_ID}"
              resources:
                cluster: "$${CLUSTER}"
                zone: "$${QUEUE}"
                memory: $${SOURCES_MEMORY}
            command_config:
              # LITERAL block scalar. A folded one (>-) joins lines with spaces and
              # turns the heredoc below into a one-line syntax error -- build
              # 77aef958. The recipe test runs bash -n and compile() on this.
              command: |
                set -euo pipefail
                OUT_DIR="$${WORKDIR_ROOT}/$${RUN_NAME}/$${BUILD_SUBDIR}/sources"
                mkdir -p "$OUT_DIR"
                /stage/.venv/bin/python - \
                  "$OUT_DIR/train.jsonl" "$${TARGET_ROWS}" "$${SHUFFLE_SEED}" \
                  "$${SOURCE_GENERAL}" "$${SOURCE_TOOLS}" "$${SOURCE_RAG}" <<'PYSRC'
                import json, random, sys
                from pathlib import Path

                out = Path(sys.argv[1])
                target = int(sys.argv[2])
                seed = int(sys.argv[3])
                srcs = [Path(p) for p in sys.argv[4:]]

                for p in srcs:
                    if not p.is_file():
                        raise SystemExit(f"FATAL: source is not a file: {p}")

                # ---- pass 1: count -------------------------------------------------
                counts = []
                for p in srcs:
                    with p.open() as fh:
                        counts.append(sum(1 for _ in fh))
                    print(f"SOURCES count {p.name} {counts[-1]}", flush=True)
                total = sum(counts)
                print(f"SOURCES count TOTAL {total}", flush=True)
                if total == 0:
                    raise SystemExit("FATAL: every source is empty")

                # target 0 means "all rows"; anything larger than the corpus is the same.
                take_all = target <= 0 or target >= total
                quotas = [
                    c if take_all else max(1, round(target * c / total)) for c in counts
                ]
                print(
                    "SOURCES quota "
                    + " ".join(f"{p.name}={q}({q/max(t,1):.4%})"
                               for p, q, t in zip(srcs, quotas, counts)),
                    flush=True,
                )

                # ---- pass 2: reservoir-sample each split ---------------------------
                # Per-split reservoirs keep the SHARE of each split fixed at its share
                # of the corpus, which a single reservoir over the concatenation would
                # only achieve in expectation.
                renamed = 0
                already = 0
                bad = 0
                picked = []
                for p, q in zip(srcs, quotas):
                    rng = random.Random(f"{seed}:{p.name}")
                    reservoir = []
                    with p.open() as fh:
                        for i, line in enumerate(fh):
                            try:
                                rec = json.loads(line)
                            except json.JSONDecodeError:
                                bad += 1
                                continue
                            # THE RENAME. prep reads record["messages"] and drops
                            # everything else as `no_messages`.
                            if "messages" in rec:
                                already += 1
                            elif "conversations" in rec:
                                rec["messages"] = rec.pop("conversations")
                                renamed += 1
                            else:
                                bad += 1
                                continue
                            if len(reservoir) < q:
                                reservoir.append(rec)
                            else:
                                j = rng.randint(0, i)
                                if j < q:
                                    reservoir[j] = rec
                    print(f"SOURCES sampled {p.name} {len(reservoir)}", flush=True)
                    picked.extend(reservoir)

                if bad:
                    print(f"SOURCES WARNING unusable rows skipped: {bad}", flush=True)
                # A corpus where NOTHING carried either spelling is a schema change,
                # not a bad row: fail rather than write an empty file prep will then
                # refuse less informatively.
                if renamed == 0 and already == 0:
                    raise SystemExit(
                        "FATAL: no row carried `conversations` or `messages`. The source "
                        "schema has changed; prep would drop every row as no_messages."
                    )

                # Interleave the splits so an early truncation downstream still sees
                # all three, and so batches are mixed rather than blocked by domain.
                random.Random(seed).shuffle(picked)

                out.parent.mkdir(parents=True, exist_ok=True)
                with out.open("w") as fh:
                    for rec in picked:
                        fh.write(json.dumps(rec, ensure_ascii=False) + "\n")

                print(f"SOURCES renamed={renamed} already_messages={already} bad={bad}", flush=True)
                print(f"SOURCES wrote {len(picked)} rows -> {out}", flush=True)
                print(f"GB_ARTIFACT_ID:corpus_source GB_ARTIFACT_PATH:{out}", flush=True)
                PYSRC
<% endif %>


    # ─── align ──────────────────────────────────────────────────────────────
    # Re-embeds the base student onto the teacher's tokenizer and emits the
    # tokenizer artifacts the rest of the pipeline reads. Cheap relative to
    # everything after it, and everything after it is wrong without it.
    align:
      environment_uri: space://environments/skypilot/lsf/ibm-bluevela
      inputs:
        # Recorded as lineage inputs. env:// means "already on a filesystem this
        # environment can reach", so the pull is a no-op: these add input
        # artifacts and no extra step. A path passed only to a step's config
        # would run fine and record nothing.
        teacher_model:
          uri: "env://$${TEACHER_MODEL}"
          type: model
        student_model:
          uri: "env://$${STUDENT_MODEL}"
          type: model
      outputs:
        # All three declared. An undeclared output makes the resolver drop the
        # NEWARTIFACT event and the target completes with no output AND no error.
        retagged_student:
          uri: "env://{{ binding.path }}"
          type: model
        teacher_overlay:
          uri: "env://{{ binding.path }}"
          type: model
        student_overlay:
          uri: "env://{{ binding.path }}"
          type: model
      steps:
        - step_uri: space://steps/distill-tokenizer-align
          config:
            poll_interval_seconds: $${POLL_INTERVAL_SECONDS}
            log_retrieval_interval_seconds: $${LOG_RETRIEVAL_INTERVAL_SECONDS}
            compute_config:
              num_nodes: 1
              num_cpus_per_node: $${CPU_ONLY_CPUS}
            launcher_config:
              image_id: "$${IMAGE_ID}"
              resources:
                cluster: "$${CLUSTER}"
                zone: "$${QUEUE}"
                memory: $${CPU_ONLY_MEMORY}
            align_config:
              teacher_model: "$${TEACHER_MODEL}"
              student_model: "$${STUDENT_MODEL}"
              out_dir: "$${WORKDIR_ROOT}/$${RUN_NAME}/$${BUILD_SUBDIR}/align"
              # Not optional for this pipeline: without a chat template carrying
              # generation markers, prep cannot build assistant masks and the
              # trainers fail deep inside sft.py. Relative to the step's code_dir.
              chat_template: "$${CHAT_TEMPLATE}"
              # FALSE for this pair, and it is the difference between this recipe
              # running and aborting. The knob gates whether the TEACHER's tokenizer
              # and the retagged student's must carry ChatML turn tokens. granite 4.0
              # and 4.1 carry start_of_role/end_of_role and no im_start anywhere, so
              # the upstream default fails align stage 1 of 4 on a granite-4.1
              # teacher. False is only safe BECAUSE CHAT_TEMPLATE is granite-native:
              # false with a ChatML template would align cleanly and then have the
              # teacher score a format it has never seen. The turn boundary is still
              # checked — align stage 4 of 4 derives the masking contract from the
              # installed template and fails if it cannot.
              require_chatml: $${REQUIRE_CHATML}
              verify: true
              dry_run: false

<% if not CORPUS_DIR | string | trim %>
    # Skipped entirely when CORPUS_DIR is set; corpus-pin-check runs instead.
    # ─── corpus ─────────────────────────────────────────────────────────────
    corpus:
      environment_uri: space://environments/skypilot/lsf/ibm-bluevela
      inputs:
        # The tokenizer that DEFINES this corpus, and the ordering edge that
        # guarantees it exists before this target starts.
        tokenizer:
          binding: align.retagged_student
        source_dataset:
          binding: sources.corpus_source
      outputs:
        # The FILE, not out_dir: the trainers dispatch on the .jsonl suffix and
        # find the manifest as a sibling of it. eval.jsonl is deliberately NOT an
        # output — it exists only when eval_fraction is above zero, and a
        # declared-but-absent output is a resolver failure.
        corpus:
          uri: "env://{{ binding.path }}"
          type: dataset
      steps:
        - step_uri: space://steps/distill-corpus-prep
          config:
            poll_interval_seconds: $${POLL_INTERVAL_SECONDS}
            log_retrieval_interval_seconds: $${LOG_RETRIEVAL_INTERVAL_SECONDS}
            compute_config:
              num_nodes: 1
              num_cpus_per_node: $${CPU_ONLY_CPUS}
            launcher_config:
              image_id: "$${IMAGE_ID}"
              resources:
                cluster: "$${CLUSTER}"
                zone: "$${QUEUE}"
                memory: $${CPU_ONLY_MEMORY}
            corpus_config:
              dataset: "{{ bindings.source_dataset.binding.path }}"
              tokenizer: "{{ bindings.tokenizer.binding.path }}"
              # ABSOLUTE, and that is forced rather than chosen: the two eval
              # targets have to name eval.jsonl and cannot compose it from their
              # own workdir, because every target run gets its OWN
              # GB_BUILD_WORKDIR. A shared absolute root is what makes one
              # target's output nameable by another.
              #
              # BUILD_SUBDIR is what keeps that root shared WITHIN a build and
              # distinct BETWEEN builds. It defaults to the build id, and it is
              # not cosmetic: gbserver refuses to register an artifact whose URI
              # another build in the space already registered, and a target whose
              # artifact was refused still reports SUCCESS with an EMPTY output
              # list. On a retry or a restart, reuse then propagates no binding
              # from that target, every downstream consumer waits forever for an
              # input that will never arrive, and the build reports SUCCESS having
              # skipped them. Build b5f030cd did exactly that. See README.
              out_dir: "$${WORKDIR_ROOT}/$${RUN_NAME}/$${BUILD_SUBDIR}/corpus"
              # Must equal both trainers' max_length and both evals'. Four steps
              # measure lengths and they have to agree about the budget, which is
              # why this is one parameter and not four.
              max_length: $${MAX_LENGTH}
              think_policy: "$${THINK_POLICY}"
              # last_message, and this couples to the eval step: the divergence
              # is measured over the FINAL assistant turn, so a corpus prepared
              # with a different boundary would be scored on a different span
              # than it trained on.
              completion_boundary: "last_message"
              # Above zero on purpose: eval-transfer measures the held-out split,
              # and at zero that split does not exist.
              eval_fraction: $${EVAL_FRACTION}
              max_examples: $${MAX_EXAMPLES}
              # The schema the reference corpus carries. Costs nothing and makes a
              # row traceable back through the manifest.
              emit_row_id: true
              # KEEP, against the step's own default of drop. The step defaults to
              # dropping rows with a non-empty documents field because "granite's
              # chat template does not render documents" — but the granite 4.x
              # template this pipeline installs DOES render them, into the system
              # turn via documents_system_message_prefix. Dropping them here would
              # silently discard grounded rows for a reason that is not true of this
              # template.
              documents_policy: "$${DOCUMENTS_POLICY}"
              seed: $${SEED}
<% else %>
    # ─── corpus-pin-check (only when CORPUS_DIR is set) ─────────────────────
    # The corpus is DEFINED by the retagged tokenizer and by the prep policies: the
    # rows were rendered through that chat template, the assistant masks were built
    # with that tokenizer, and 5,908 rows were dropped for exceeding THAT max_length.
    # A pin taken from a run that differed in any of those trains on a corpus this
    # build does not describe, and every metric downstream would still look normal.
    #
    # So this target exists to turn that into a loud failure, and to do it BEFORE the
    # 2-node H100 allocation is held. It is CPU-only and reads one JSON file, so the
    # cost of having it is seconds; the cost of not having it is a run.
    #
    # Every consumer of the pinned corpus binds this target's output, which is what
    # makes the check an ordering edge rather than a suggestion.
    corpus-pin-check:
      environment_uri: space://environments/skypilot/lsf/ibm-bluevela
      inputs:
        # Declared so the pinned corpus appears in this build's lineage at all: with
        # `sources` and `corpus` gone, this is the only place it is named as an input.
        pinned_corpus:
          uri: "env://$${CORPUS_DIR.rstrip('/')}/train.jsonl"
          type: dataset
        # The tokenizer the manifest has to agree with, and the ordering edge that
        # guarantees align has run before the comparison is made.
        tokenizer:
          binding: align.retagged_student
      outputs:
        pin_check:
          uri: "env://{{ binding.path }}"
          type: fileset
      steps:
        - step_uri: space://steps/command
          config:
            poll_interval_seconds: $${POLL_INTERVAL_SECONDS}
            log_retrieval_interval_seconds: $${LOG_RETRIEVAL_INTERVAL_SECONDS}
            compute_config:
              num_nodes: 1
              num_cpus_per_node: $${CPU_ONLY_CPUS}
            launcher_config:
              image_id: "$${IMAGE_ID}"
              resources:
                cluster: "$${CLUSTER}"
                zone: "$${QUEUE}"
                memory: $${CPU_ONLY_MEMORY}
            command_config:
              # LITERAL block scalar, and the arguments are passed positionally rather
              # than interpolated into the python: the same discipline the other
              # command steps in this file use, for the same reason (build 77aef958
              # for the block scalar, bb779f1f for what a stray blank line does to a
              # backslash-continued argument list -- there are none here).
              command: |
                set -euo pipefail
                OUT_DIR="$${WORKDIR_ROOT}/$${RUN_NAME}/$${BUILD_SUBDIR}/corpus-pin"
                mkdir -p "$OUT_DIR"
                /stage/.venv/bin/python - \
                  "$${CORPUS_DIR.rstrip('/')}" \
                  "$${TEACHER_MODEL}" \
                  "$${MAX_LENGTH}" \
                  "$${THINK_POLICY}" \
                  "$${DOCUMENTS_POLICY}" \
                  "$${EVAL_FRACTION}" \
                  "{{ bindings.tokenizer.binding.path }}" \
                  "$OUT_DIR/corpus_pin.json" \
                  <<'PYSRC'
                import hashlib, json, sys
                from pathlib import Path

                corpus = Path(sys.argv[1])
                teacher = sys.argv[2]
                max_length = int(sys.argv[3])
                think_policy = sys.argv[4]
                documents_policy = sys.argv[5]
                eval_fraction = float(sys.argv[6])
                tokenizer_dir = Path(sys.argv[7])
                out = Path(sys.argv[8])

                problems = []

                manifest_path = corpus / "corpus_manifest.json"
                if not manifest_path.is_file():
                    raise SystemExit(f"FATAL: no corpus_manifest.json under {corpus}")
                manifest = json.loads(manifest_path.read_text())

                # The splits, before anything else: a pin whose files were cleaned up
                # is the most likely way this target fires, and the cheapest to say.
                for name in ("train.jsonl", "eval.jsonl"):
                    if not (corpus / name).is_file():
                        problems.append(f"{name} is missing from {corpus}")

                # What the corpus was built AGAINST.
                want_identity = Path(teacher.rstrip("/")).name
                got_identity = manifest.get("tokenizer_identity")
                if got_identity != want_identity:
                    problems.append(
                        f"tokenizer_identity {got_identity!r} != this build's teacher "
                        f"{want_identity!r}"
                    )

                # What the corpus was built WITH. completion_boundary is not a
                # parameter -- the recipe hard-codes last_message because the eval
                # measures divergence over the final assistant turn -- so it is
                # compared against that literal rather than against a parameter.
                policies = manifest.get("policies") or {}
                for key, want in (
                    ("max_length", max_length),
                    ("think_policy", think_policy),
                    ("documents_policy", documents_policy),
                    ("completion_boundary", "last_message"),
                ):
                    got = policies.get(key)
                    if got != want:
                        problems.append(f"policies.{key} {got!r} != {want!r}")

                if float(manifest.get("eval_fraction", -1)) != eval_fraction:
                    problems.append(
                        f"eval_fraction {manifest.get('eval_fraction')!r} != "
                        f"{eval_fraction!r}"
                    )

                # Strongest available check, when it is available: the manifest records
                # the tokenizer directory it used, so if that directory still exists we
                # compare bytes rather than trusting a name. It is allowed to be gone --
                # a pin should outlive the build that produced it -- and the report says
                # which mode ran, so a reader never has to guess how strict this was.
                pinned_tok = Path(str(manifest.get("tokenizer_path") or ""))
                mode = "identity-only (pinned tokenizer_path no longer on disk)"
                if pinned_tok.is_dir():
                    mode = "byte-compared against the pinned tokenizer_path"
                    for name in ("tokenizer.json", "chat_template.jinja"):
                        here, there = tokenizer_dir / name, pinned_tok / name
                        if not there.is_file():
                            problems.append(f"{name} missing from {pinned_tok}")
                        elif not here.is_file():
                            problems.append(f"{name} missing from {tokenizer_dir}")
                        else:
                            hh = hashlib.sha256(here.read_bytes()).hexdigest()
                            th = hashlib.sha256(there.read_bytes()).hexdigest()
                            if hh != th:
                                problems.append(
                                    f"{name} differs: this build {hh[:16]} vs pinned "
                                    f"{th[:16]}"
                                )

                # Every problem, not the first: whoever is re-pointing a sweep at a
                # corpus wants the whole list in one read, not one per relaunch.
                if problems:
                    print(f"CORPUS-PIN REJECTED {corpus}", flush=True)
                    for p in problems:
                        print(f"  - {p}", flush=True)
                    raise SystemExit(
                        f"FATAL [corpus-pin-check]: {len(problems)} mismatch(es) "
                        f"between this build and the pinned corpus manifest"
                    )

                report = {
                    "corpus_dir": str(corpus),
                    "accepted": True,
                    "tokenizer_check": mode,
                    "tokenizer_identity": got_identity,
                    "policies": policies,
                    "eval_fraction": manifest.get("eval_fraction"),
                    "seed": manifest.get("seed"),
                    "counts": manifest.get("counts"),
                    "splits": manifest.get("splits"),
                }
                out.write_text(json.dumps(report, indent=2))
                print(f"CORPUS-PIN ACCEPTED {corpus} ({mode})", flush=True)
                print(f"GB_ARTIFACT_ID:pin_check GB_ARTIFACT_PATH:{out}", flush=True)
                PYSRC

<% endif %>

<% if INCLUDE_SFT | string | lower in ("true", "yes", "1", "on") %>
    # ─── train-sft (switched on) ────────────────────────────────────────────
    # A plain-SFT pass over the same corpus, with no teacher in the loop. GOLD
    # then continues from this checkpoint. The step's ZeRO-3 config sets
    # zero3_save_16bit_model and sft.py calls save_model on the output directory,
    # so the registered checkpoint is HF-native and loadable as a student init —
    # which is why no export is needed between here and GOLD.
    train-sft:
      environment_uri: space://environments/skypilot/lsf/ibm-bluevela
      inputs:
        student:
          binding: align.retagged_student
<% if CORPUS_DIR | string | trim %>
        # Pinned: read DIRECTLY, because `corpus` was not rendered and a binding
        # naming it would block this target on a producer that does not exist.
        corpus:
          uri: "env://$${CORPUS_DIR.rstrip('/')}/train.jsonl"
          type: dataset
        # The ordering edge the binding used to provide, now carrying the manifest
        # comparison with it: nothing reads a pinned corpus before it is checked.
        corpus_pin:
          binding: corpus-pin-check.pin_check
<% else %>
        corpus:
          binding: corpus.corpus
<% endif %>
      outputs:
        checkpoint:
          uri: "env://{{ binding.path }}"
          type: model
      steps:
        - step_uri: space://steps/distill-sft-baseline
          config:
            poll_interval_seconds: $${POLL_INTERVAL_SECONDS}
            log_retrieval_interval_seconds: $${LOG_RETRIEVAL_INTERVAL_SECONDS}
            compute_config:
              num_nodes: 1
              num_gpus_per_node: $${SFT_NUM_GPUS}
            launcher_config:
              image_id: "$${IMAGE_ID}"
              resources:
                accelerators: "H100:$${SFT_NUM_GPUS}"
                cluster: "$${CLUSTER}"
                zone: "$${QUEUE}"
                memory: $${GPU_MEMORY}
            workload:
              # MUST match the allocation above: run-sft.sh asserts this against
              # the GPUs visible in the container, because a mismatch trains at a
              # different effective batch size than the config says. More than one
              # node is refused by the script.
              gpus_per_node: $${SFT_NUM_GPUS}
              nodes: 1
            sft_config:
              student_model_path: "{{ bindings.student.binding.path }}"
              corpus_path: "{{ bindings.corpus.binding.path }}"
              output_dir: "$${WORKDIR_ROOT}/$${RUN_NAME}/$${BUILD_SUBDIR}/train-sft"
              response_template: "$${RESPONSE_TEMPLATE}"
              max_length: $${MAX_LENGTH}
              per_device_train_batch_size: $${SFT_PER_DEVICE_TRAIN_BATCH_SIZE}
              gradient_accumulation_steps: $${SFT_GRADIENT_ACCUMULATION_STEPS}
              learning_rate: "$${SFT_LEARNING_RATE}"
              num_train_epochs: $${SFT_NUM_TRAIN_EPOCHS}
              # Checkpoint on the first step, so publication is exercised rather
              # than assumed on a run this short.
              save_steps: 1
              seed: $${SEED}
              # LEFT AT THE DEFAULT (-1, the whole corpus). max_dataset_size and
              # corpus max_examples are NOT interchangeable ways to make a run
              # small: sft.py compares its kept-row count against PREP's manifest
              # and raises ManifestDrift on any shortfall, because the only
              # shortfall it knows how to cause is a row whose tokenization
              # produced no prompt — a chat-template or tokenizer mismatch. Shrink
              # the CORPUS instead, so the two counts agree by construction.
              max_dataset_size: -1
              # logging_steps is not a contract key; it reaches the trainer through
              # extra_config_yaml, the documented escape hatch for the long tail of
              # CustomSFTConfig. At the step's default of 10 a run this short logs
              # nothing and there is no loss trajectory to read.
              extra_config_yaml: "logging_steps: 1"
              # EMPTY is what makes this a plain-SFT pass. With a logits directory
              # the step becomes a forward-KL distillation arm of its own, and the
              # pipeline would distil twice rather than warm-start once.
              precomputed_logits_dir: ""
<% endif %>

    # ─── train-gold ─────────────────────────────────────────────────────────
    # The distillation itself. Off-policy at lmbda 0.0: every rank trains on the
    # fixed corpus and there is no vLLM server to coordinate.
    #
    # This is the target v2 exists to change. Everything here except the five keys
    # under "the anchor and the instruments" is what build df8512e0 ran.
    train-gold:
      environment_uri: space://environments/skypilot/lsf/ibm-bluevela
      inputs:
        # The student GOLD starts from: the SFT checkpoint when that arm is on,
        # the aligned student otherwise. One binding either way, so the recorded
        # lineage and the trainer's argument cannot disagree about which model
        # was loaded.
<% if INCLUDE_SFT | string | lower in ("true", "yes", "1", "on") %>
        student:
          binding: train-sft.checkpoint
<% else %>
        student:
          binding: align.retagged_student
<% endif %>
<% if CORPUS_DIR | string | trim %>
        # Pinned: read DIRECTLY, because `corpus` was not rendered and a binding
        # naming it would block this target on a producer that does not exist.
        corpus:
          uri: "env://$${CORPUS_DIR.rstrip('/')}/train.jsonl"
          type: dataset
        # The ordering edge the binding used to provide, now carrying the manifest
        # comparison with it: nothing reads a pinned corpus before it is checked.
        corpus_pin:
          binding: corpus-pin-check.pin_check
<% else %>
        corpus:
          binding: corpus.corpus
<% endif %>
        teacher_model:
          uri: "env://$${TEACHER_MODEL}"
          type: model
      outputs:
        # GB_BUILD_WORKDIR/checkpoints/<run_name>_node<N>, registered by rank 0.
        # The node count in that path comes from the allocation, not from a
        # parameter, so it always describes the run that produced it.
        checkpoint:
          uri: "env://{{ binding.path }}"
          type: model
      steps:
        - step_uri: space://steps/gold-distill
          config:
            poll_interval_seconds: $${POLL_INTERVAL_SECONDS}
            log_retrieval_interval_seconds: $${LOG_RETRIEVAL_INTERVAL_SECONDS}
            compute_config:
              num_nodes: $${GOLD_NUM_NODES}
              num_gpus_per_node: $${GOLD_NUM_GPUS}
            launcher_config:
              # Overrides the step's own image (gbserver prefers a build.yaml
              # image_id over the launcher's).
              image_id: "$${IMAGE_ID}"
              resources:
                # accelerators is PER NODE; memory is host memory per node, and
                # it has to be stated — the LSF provisioner defaults to 16G and a
                # host-memory kill presents as a cross-node NCCL hang.
                accelerators: "H100:$${GOLD_NUM_GPUS}"
                memory: $${GPU_MEMORY}
                cluster: "$${CLUSTER}"
                # For the LSF cloud, SkyPilot's zone is the queue name.
                zone: "$${QUEUE}"
            gold_config:
              run_name: "$${RUN_NAME}"
              kd_code_dir: "$${KD_CODE_DIR}"
              # Asserted, not merely recorded. df8512e0 logged kd_sandbox_commit
              # fc7d66e while the checkout carried 159 uncommitted files including
              # gold/, so its one record of what trained named a commit whose code
              # did not run. A mismatch or a dirty tree fails this target in seconds.
              kd_expect_ref: "$${KD_EXPECT_REF}"
              ds_config: "$${DS_CONFIG}"
              model_name_or_path: "{{ bindings.student.binding.path }}"
              # A path, never a hub id: this teacher is not publicly fetchable.
              teacher_model_name_or_path: "$${TEACHER_MODEL}"
              dataset_name: "{{ bindings.corpus.binding.path }}"
              num_train_epochs: $${GOLD_NUM_TRAIN_EPOCHS}
              # Caps the run by optimizer steps, and here that IS the point rather
              # than a smoke-scale shortcut: the objective had ~12% of headroom and
              # two-thirds of the realisable gain was gone by step 509, so an
              # epoch-bounded run spends 75% of its wall clock past the point where
              # anything is left to learn. When set, this overrides num_train_epochs
              # in the trainer.
              max_steps: $${GOLD_MAX_STEPS}
              learning_rate: $${GOLD_LEARNING_RATE}
              min_lr: $${GOLD_MIN_LR}
              warmup_ratio: $${WARMUP_RATIO}
              lr_scheduler_type: "$${LR_SCHEDULER_TYPE}"
              per_device_train_batch_size: $${GOLD_PER_DEVICE_TRAIN_BATCH_SIZE}
              gradient_accumulation_steps: $${GOLD_GRADIENT_ACCUMULATION_STEPS}
              max_length: $${MAX_LENGTH}
              max_completion_length: $${MAX_COMPLETION_LENGTH}
              gradient_checkpointing: true
              save_strategy: "steps"
              save_steps: $${GOLD_SAVE_STEPS}
              save_total_limit: $${GOLD_SAVE_TOTAL_LIMIT}
              logging_steps: 1
              dataset_num_proc: $${DATASET_NUM_PROC}
              temperature: $${TEMPERATURE}
              lmbda: $${LMBDA}
              beta: $${BETA}
              use_liger_fused_jsd: $${USE_LIGER_FUSED_JSD}

              # ── the anchor and the instruments ──────────────────────────────
              # All five need the patched trainer at KD_CODE_DIR. They render into
              # the trainer's config only when non-default, so a zeroed CE_COEF and
              # a zeroed guard reproduce df8512e0's objective exactly — which is
              # what makes the control arm a control.
              ce_coef: $${CE_COEF}
              log_student_entropy: $${LOG_STUDENT_ENTROPY}
              entropy_guard_drop_frac: $${ENTROPY_GUARD_DROP_FRAC}
              entropy_guard_baseline_steps: $${ENTROPY_GUARD_BASELINE_STEPS}
              entropy_guard_patience: $${ENTROPY_GUARD_PATIENCE}
              entropy_guard_action: "$${ENTROPY_GUARD_ACTION}"

              response_template: "$${RESPONSE_TEMPLATE}"
              nccl_debug: "$${NCCL_DEBUG}"
              nccl_debug_subsys: "$${NCCL_DEBUG_SUBSYS}"
              nccl_timeout_ms: $${NCCL_TIMEOUT_MS}
              nccl_enable_monitoring: true
              vllm_num_servers: 0

    # ─── export-<N>, one per checkpoint in CKPT_LADDER ──────────────────────
    # A selector, not a converter: the trainer's ZeRO-3 config sets
    # zero3_save_16bit_model, so each checkpoint is already HF-native safetensors.
    #
    # stage 1 exported one model — "the last one" — which is exactly the assumption
    # that failed. Its best checkpoint was almost certainly early, and by the time
    # anyone knew that, save_total_limit had deleted it. Here every ladder rung is
    # exported and measured, and which one ships is decided from the readings.
    # ~679 M each after pruning, CPU-only, so four of them cost no GPU time.
<% for N in CKPT_LADDER.split(",") %>
    export-$${N}:
      environment_uri: space://environments/skypilot/lsf/ibm-bluevela
      inputs:
        train_output:
          binding: train-gold.checkpoint
        # Bound so the export can assert the tokenizer it ships is the one the run
        # actually trained with, rather than whatever happened to be copied into the
        # checkpoint directory.
        expected_tokenizer:
          binding: align.retagged_student
      outputs:
        hf_model:
          uri: "env://{{ binding.path }}"
          type: model
      steps:
        - step_uri: space://steps/distill-hf-export
          config:
            poll_interval_seconds: $${POLL_INTERVAL_SECONDS}
            log_retrieval_interval_seconds: $${LOG_RETRIEVAL_INTERVAL_SECONDS}
            compute_config:
              num_nodes: 1
              num_cpus_per_node: $${EXPORT_CPUS}
            launcher_config:
              image_id: "$${IMAGE_ID}"
              resources:
                cluster: "$${CLUSTER}"
                zone: "$${QUEUE}"
                memory: $${EXPORT_MEMORY}
            export_config:
              train_output_dir: "{{ bindings.train_output.binding.path }}"
              dest: "$${WORKDIR_ROOT}/$${RUN_NAME}/$${BUILD_SUBDIR}/export-$${N}"
              # Named explicitly, never left empty. Empty means "highest step
              # number", which for a guard-stopped run is whatever step the guard
              # happened to fire on — a moving target across the two arms.
              checkpoint: "checkpoint-$${N}"
              padding_side: "right"
              chat_template_thinking: "$${CHAT_TEMPLATE_THINKING}"
              # TRUE, and forced rather than lax. HF Trainer writes one
              # rng_state_<rank>.pth per rank for a distributed run, while the
              # ported classifier's PRUNE_KNOWN carries only the single-process
              # "rng_state.pth" — it was validated against a 1-GPU checkpoint. So
              # every checkpoint this pipeline produces contains files it cannot
              # classify, and with false the export refuses AFTER the training run
              # has been paid for. export_manifest.json still records exactly what
              # was dropped. The fix is one line upstream.
              allow_unknown: true
              verify: true
              expect_tokenizer_from: "{{ bindings.expected_tokenizer.binding.path }}"
<% endfor %>

    # ─── eval-transfer-baseline ─────────────────────────────────────────────
    # The t=0 read, and not optional decoration: a divergence with no baseline is
    # a number without a direction. This measures the aligned student BEFORE any
    # training, against the same teacher on the same held-out split.
    #
    # It depends only on align and corpus, so it runs concurrently with training
    # rather than after it.
    eval-transfer-baseline:
      environment_uri: space://environments/skypilot/lsf/ibm-bluevela
      inputs:
        student:
          binding: align.retagged_student
        # For the ORDERING EDGE, not for the path: eval.jsonl is not a declared
        # artifact, so the corpus below is composed from the same root the corpus
        # came from -- CORPUS_DIR when pinned, this build's own subdir otherwise.
        # The upstream edge is what still guarantees this
        # target cannot start before the split exists.
<% if CORPUS_DIR | string | trim %>
        # Pinned: read DIRECTLY, because `corpus` was not rendered and a binding
        # naming it would block this target on a producer that does not exist.
        corpus:
          uri: "env://$${CORPUS_DIR.rstrip('/')}/train.jsonl"
          type: dataset
        # The ordering edge the binding used to provide, now carrying the manifest
        # comparison with it: nothing reads a pinned corpus before it is checked.
        corpus_pin:
          binding: corpus-pin-check.pin_check
<% else %>
        corpus:
          binding: corpus.corpus
<% endif %>
      outputs:
        eval_metrics:
          uri: "env://{{ binding.path }}"
          type: fileset
      steps:
        - step_uri: space://steps/distill-eval
          config:
            poll_interval_seconds: $${POLL_INTERVAL_SECONDS}
            log_retrieval_interval_seconds: $${LOG_RETRIEVAL_INTERVAL_SECONDS}
            compute_config:
              num_nodes: 1
              num_gpus_per_node: $${EVAL_NUM_GPUS}
            launcher_config:
              image_id: "$${IMAGE_ID}"
              resources:
                # Real GPU work: a forward pass through each of two models.
                accelerators: "H100:$${EVAL_NUM_GPUS}"
                cluster: "$${CLUSTER}"
                zone: "$${QUEUE}"
                memory: $${GPU_MEMORY}
            eval_config:
              student_model: "{{ bindings.student.binding.path }}"
              teacher_model: "$${TEACHER_MODEL}"
<% if CORPUS_DIR | string | trim %>
              corpus: "$${CORPUS_DIR.rstrip('/')}/eval.jsonl"
<% else %>
              corpus: "$${WORKDIR_ROOT}/$${RUN_NAME}/$${BUILD_SUBDIR}/corpus/eval.jsonl"
<% endif %>
              output_dir: "$${WORKDIR_ROOT}/$${RUN_NAME}/$${BUILD_SUBDIR}/eval-transfer-baseline"
              metrics: "$${EVAL_METRICS}"
              max_samples: $${EVAL_MAX_SAMPLES}
              seed: $${SEED}
              # Same budget as prep and as training: a smaller value here scores
              # truncated completions and reports the result as the divergence.
              max_length: $${MAX_LENGTH}
              max_incomplete_fraction: $${MAX_INCOMPLETE_FRACTION}
              batch_size: $${EVAL_BATCH_SIZE}
              dtype: "$${EVAL_DTYPE}"
              # False, and it should stay false on this pairing: the retag exists
              # precisely so the two tokenizers agree on ids.
              allow_tokenizer_mismatch: false

    # ─── eval-transfer-<N>, one per checkpoint ──────────────────────────────
    # The post-training reads. Same step, same teacher, same corpus, same budget as
    # the baseline — everything except the student is held fixed, which is the only
    # way the numbers are comparable to each other and to the t=0 column.
    #
    # metrics carries entropy for a reason that is no longer theoretical: at 256
    # samples this is the only place the 42% entropy drop was visible on the last
    # run, and it was visible only after training had finished. Per-checkpoint, it
    # becomes a curve, and the curve is what says where the model turned.
    #
    # Minutes on one GPU each, so all four together cost less than a single
    # full-eval — which is why full-eval is gated on these rather than run beside
    # them.
<% for N in CKPT_LADDER.split(",") %>
    eval-transfer-$${N}:
      environment_uri: space://environments/skypilot/lsf/ibm-bluevela
      inputs:
        student:
          binding: export-$${N}.hf_model
<% if CORPUS_DIR | string | trim %>
        # Pinned: read DIRECTLY, because `corpus` was not rendered and a binding
        # naming it would block this target on a producer that does not exist.
        corpus:
          uri: "env://$${CORPUS_DIR.rstrip('/')}/train.jsonl"
          type: dataset
        # The ordering edge the binding used to provide, now carrying the manifest
        # comparison with it: nothing reads a pinned corpus before it is checked.
        corpus_pin:
          binding: corpus-pin-check.pin_check
<% else %>
        corpus:
          binding: corpus.corpus
<% endif %>
      outputs:
        eval_metrics:
          uri: "env://{{ binding.path }}"
          type: fileset
      steps:
        - step_uri: space://steps/distill-eval
          config:
            poll_interval_seconds: $${POLL_INTERVAL_SECONDS}
            log_retrieval_interval_seconds: $${LOG_RETRIEVAL_INTERVAL_SECONDS}
            compute_config:
              num_nodes: 1
              num_gpus_per_node: $${EVAL_NUM_GPUS}
            launcher_config:
              image_id: "$${IMAGE_ID}"
              resources:
                accelerators: "H100:$${EVAL_NUM_GPUS}"
                cluster: "$${CLUSTER}"
                zone: "$${QUEUE}"
                memory: $${GPU_MEMORY}
            eval_config:
              student_model: "{{ bindings.student.binding.path }}"
              teacher_model: "$${TEACHER_MODEL}"
<% if CORPUS_DIR | string | trim %>
              corpus: "$${CORPUS_DIR.rstrip('/')}/eval.jsonl"
<% else %>
              corpus: "$${WORKDIR_ROOT}/$${RUN_NAME}/$${BUILD_SUBDIR}/corpus/eval.jsonl"
<% endif %>
              output_dir: "$${WORKDIR_ROOT}/$${RUN_NAME}/$${BUILD_SUBDIR}/eval-transfer-$${N}"
              metrics: "$${EVAL_METRICS}"
              max_samples: $${EVAL_MAX_SAMPLES}
              seed: $${SEED}
              max_length: $${MAX_LENGTH}
              max_incomplete_fraction: $${MAX_INCOMPLETE_FRACTION}
              batch_size: $${EVAL_BATCH_SIZE}
              dtype: "$${EVAL_DTYPE}"
              allow_tokenizer_mismatch: false
<% endfor %>

    # ─── gen-smoke ──────────────────────────────────────────────────────────
    # Does the model still write text? Nothing upstream asks that.
    #
    # df8512e0's collapse was invisible to every metric the pipeline computed during
    # training, and the transfer evals that could see it ran at the end. What it was
    # NOT invisible to is a handful of greedy completions: the distilled model emits
    # "// (true)" fifty times and stops. Measured degeneracy was 20.8% on Java and
    # 30.9% on Shell against a 0.4% / 6.7% baseline. That is one GPU-minute of
    # evidence, and it arrived only after ~4 GPU-h of eval had been spent confirming
    # a result already visible in the first sample.
    #
    # One target for the whole ladder rather than one per rung: the model is 350m, so
    # loading four of them serially on one GPU is still minutes.
    #
    # It FAILS the target only when the LAST rung is degenerate, because that is the
    # rung a downstream consumer would otherwise pick up. An early rung above
    # threshold is a finding to read in the table, not a reason to fail a build whose
    # later checkpoints may be fine.
    gen-smoke:
      environment_uri: space://environments/skypilot/lsf/ibm-bluevela
      inputs:
<% for N in CKPT_LADDER.split(",") %>
        export_$${N}:
          binding: export-$${N}.hf_model
<% endfor %>
      outputs:
        repetition_report:
          uri: "env://{{ binding.path }}"
          type: fileset
      steps:
        - step_uri: space://steps/command
          config:
            poll_interval_seconds: $${POLL_INTERVAL_SECONDS}
            log_retrieval_interval_seconds: $${LOG_RETRIEVAL_INTERVAL_SECONDS}
            compute_config:
              num_nodes: 1
              num_gpus_per_node: 1
            launcher_config:
              image_id: "$${IMAGE_ID}"
              resources:
                accelerators: "H100:1"
                cluster: "$${CLUSTER}"
                zone: "$${QUEUE}"
                memory: $${GPU_MEMORY}
            command_config:
              # LITERAL block scalar. A folded one (>-) joins lines with spaces and
              # turns the heredoc below into a one-line syntax error -- build
              # 77aef958. The recipe test runs bash -n and compile() on this.
              #
              # The rungs go into an array, one append per iteration, and NOT into a
              # backslash-continued argument list. Jinja block tags are not trimmed
              # here, so every one of them leaves a blank line where it stood, and a
              # blank line after a `\` ends the command -- bash then runs the next rung
              # as a program name. That is build bb779f1f: `line 26: 500:/proj/.../export-500:
              # No such file or directory`, python reached with no heredoc and no rungs,
              # and `bash -n` green throughout, because `500:/path` is a valid command.
              # Blank lines BETWEEN array appends are inert, which is the whole point.
              command: |
                set -euo pipefail
                OUT_DIR="$${WORKDIR_ROOT}/$${RUN_NAME}/$${BUILD_SUBDIR}/gen-smoke"
                mkdir -p "$OUT_DIR"
                RUNGS=()
<% for N in CKPT_LADDER.split(",") %>
                RUNGS+=("$${N}:$${WORKDIR_ROOT}/$${RUN_NAME}/$${BUILD_SUBDIR}/export-$${N}")
<% endfor %>
                /stage/.venv/bin/python - \
                  "$OUT_DIR/repetition.json" "$${GEN_SMOKE_MAX_REPETITION}" \
                  "$${GEN_SMOKE_NEW_TOKENS}" \
                  "${RUNGS[@]}" \
                  <<'PYSRC'
                import json, sys
                from pathlib import Path

                out = Path(sys.argv[1])
                threshold = float(sys.argv[2])
                new_tokens = int(sys.argv[3])
                rungs = [a.split(":", 1) for a in sys.argv[4:]]

                # Raw completion prompts, deliberately: MultiPL-E is where the
                # collapse showed worst, and it applies no chat template. A prompt
                # set that went through the template would test a different thing
                # from the benchmark that caught this.
                PROMPTS = [
                    "def has_close_elements(numbers, threshold):\n",
                    "def sum_to_n(n: int):\n    \"\"\"Sum numbers from 1 to n.\"\"\"\n",
                    "public class Solution {\n    public static int count(int[] a) {\n",
                    "#!/bin/bash\n# Print the first argument twice.\n",
                    "fn factorial(n: u64) -> u64 {\n",
                    "The capital of France is",
                    "Q: What is 17 + 25?\nA:",
                    "Write a haiku about autumn.\n",
                ]

                def adjacent_rate(lines):
                    """Fraction of adjacent line pairs that are identical.

                    Reported, not gated on. This is the shape of the detector whose
                    numbers the df8512e0 post-mortem records (baseline 0.4% Java /
                    2.1% Rust / 6.7% Shell against the collapsed 20.8% / 18.2% /
                    30.9%), so it is kept for continuity with those figures — but it
                    is NOT a safe gate on short samples. A correct 7-line Java
                    function scores 0.167 on it, because two dedented closing braces
                    are legitimately identical and on six pairs one collision is
                    17%. Gating on that would fail healthy checkpoints.
                    """
                    if len(lines) < 2:
                        return 0.0
                    repeats = sum(1 for a, b in zip(lines, lines[1:]) if a == b)
                    return repeats / (len(lines) - 1)

                def looped_fraction(lines, min_run=3):
                    """Fraction of lines inside a run of >= min_run identical lines.

                    THIS is what gates, because it is what the failure actually looks
                    like: the collapsed model wrote "// (true)" about fifty times in
                    a row. Real code repeats a line twice in passing; it does not
                    repeat one three times running. On the two samples in the
                    post-mortem this separates cleanly — 1.00 for the collapsed Java
                    output, 0.00 for the correct one — where the adjacent-pair rate
                    puts them 0.17 apart.

                    Lines are compared with indentation intact (rstrip only), so
                    "    }" and "}" are different lines, which is the other half of
                    why the brace case does not trigger it.
                    """
                    if not lines:
                        return 0.0
                    looped, i = 0, 0
                    while i < len(lines):
                        j = i
                        while j + 1 < len(lines) and lines[j + 1] == lines[i]:
                            j += 1
                        run = j - i + 1
                        if run >= min_run:
                            looped += run
                        i = j + 1
                    return looped / len(lines)

                def measure(text):
                    lines = [ln.rstrip() for ln in text.splitlines() if ln.strip()]
                    return looped_fraction(lines), adjacent_rate(lines)

                import torch
                from transformers import AutoModelForCausalLM, AutoTokenizer

                rows = []
                for step, path in rungs:
                    tok = AutoTokenizer.from_pretrained(path)
                    model = AutoModelForCausalLM.from_pretrained(
                        path, dtype=torch.bfloat16, device_map="cuda"
                    )
                    model.eval()

                    looped, adjacent, samples = [], [], []
                    for prompt in PROMPTS:
                        ids = tok(prompt, return_tensors="pt").to(model.device)
                        with torch.no_grad():
                            # GREEDY. Sampling would hide the failure: temperature
                            # is what lets a narrowed distribution still look
                            # varied, and greedy decoding of a collapsed model is a
                            # fixed-point search.
                            gen = model.generate(
                                **ids,
                                max_new_tokens=new_tokens,
                                do_sample=False,
                                pad_token_id=tok.pad_token_id or tok.eos_token_id,
                            )
                        text = tok.decode(
                            gen[0][ids["input_ids"].shape[1]:], skip_special_tokens=True
                        )
                        one_looped, one_adjacent = measure(text)
                        looped.append(one_looped)
                        adjacent.append(one_adjacent)
                        samples.append(
                            {
                                "prompt": prompt,
                                "completion": text[:400],
                                "looped_fraction": round(one_looped, 4),
                            }
                        )

                    mean_looped = sum(looped) / len(looped)
                    rows.append(
                        {
                            "step": int(step),
                            "path": path,
                            "mean_looped_fraction": round(mean_looped, 4),
                            "worst_looped_fraction": round(max(looped), 4),
                            "mean_adjacent_rate": round(sum(adjacent) / len(adjacent), 4),
                            "degenerate": mean_looped > threshold,
                            "samples": samples,
                        }
                    )
                    print(
                        f"GEN-SMOKE step={step} looped={mean_looped:.4f} "
                        f"worst_looped={max(looped):.4f} "
                        f"adjacent={sum(adjacent) / len(adjacent):.4f} "
                        f"threshold={threshold} "
                        f"{'DEGENERATE' if mean_looped > threshold else 'ok'}",
                        flush=True,
                    )
                    del model
                    torch.cuda.empty_cache()

                out.parent.mkdir(parents=True, exist_ok=True)
                out.write_text(json.dumps({"threshold": threshold, "rungs": rows}, indent=2))
                print(f"GB_ARTIFACT_ID:repetition_report GB_ARTIFACT_PATH:{out}", flush=True)

                print(
                    "GEN-SMOKE table (step, looped, worst, adjacent, verdict):",
                    flush=True,
                )
                for r in rows:
                    print(
                        f"  {r['step']:>6}  {r['mean_looped_fraction']:.4f}  "
                        f"{r['worst_looped_fraction']:.4f}  "
                        f"{r['mean_adjacent_rate']:.4f}  "
                        f"{'DEGENERATE' if r['degenerate'] else 'ok'}",
                        flush=True,
                    )

                # Only the last rung gates. The earlier ones are the curve.
                if rows[-1]["degenerate"]:
                    print(
                        f"GEN-SMOKE FATAL: the final checkpoint (step "
                        f"{rows[-1]['step']}) has "
                        f"{rows[-1]['mean_looped_fraction']:.1%} of its generated "
                        f"lines inside a repeated run, above the {threshold:.1%} "
                        f"threshold. Read repetition.json before spending full-eval "
                        f"on it.",
                        file=sys.stderr,
                        flush=True,
                    )
                    sys.exit(1)
                PYSRC

    # ─── eval-bfcl-baseline, then eval-bfcl-<N> per rung ────────────────────
    # Capability, against ground truth. A DIFFERENT question from eval-transfer,
    # and neither substitutes for the other: a student can move toward the
    # teacher's distribution while losing tool-calling accuracy, and the transfer
    # metric cannot see that. Wired directly rather than wrapped by distill-eval,
    # so its own artifacts stay its own — and it runs in its own image, so no
    # image_id override here.
    #
    # ONE PER RUNG, PLUS A BASELINE, and the two failed builds are the argument.
    # bb779f1f bound this to the last rung only, as a plumbing check. What came back
    # was accuracy 0.000 (0/400) at step 2,000 — with no baseline to compare it
    # against and no reading at any earlier step, so it could not say whether the
    # capability was lost by step 25 or step 1,999, nor whether the starting student
    # could do the task at all. Every divergence metric in that build improved while
    # this one sat at zero, which is precisely the failure eval-transfer cannot see.
    # A ladder of divergence readings next to a single capability reading measures
    # the wrong thing carefully.
    #
    # ~10 min each on 1 H100 at BFCL_TEST_CATEGORIES simple, and they are independent,
    # so the eight of them cost about what one did in wall-clock.
    eval-bfcl-baseline:
      environment_uri: space://environments/skypilot/lsf/ibm-bluevela
      inputs:
        # The aligned student, untrained. A capability number with no baseline is a
        # number without a direction — the same reason eval-transfer-baseline exists.
        model:
          binding: align.retagged_student
      outputs:
        # A single result FILE, chosen by the step from what the BFCL harness
        # produced.
        bfcl_results:
          uri: "env://{{ binding.path }}"
          type: dataset
      steps:
        - step_uri: space://steps/bfcl-eval
          config:
            poll_interval_seconds: $${POLL_INTERVAL_SECONDS}
            log_retrieval_interval_seconds: $${LOG_RETRIEVAL_INTERVAL_SECONDS}
            bfcl_config:
              model_path: "{{ bindings.model.binding.path }}"
              model_id: "$${BFCL_MODEL_ID}"
              experiment: "$${RUN_NAME}-baseline"
              eval_name: "$${BFCL_EVAL_NAME}"
              test_categories: "$${BFCL_TEST_CATEGORIES}"
              num_gpus_generate: $${BFCL_NUM_GPUS}
              num_gpus_evaluate: $${BFCL_NUM_GPUS}
              gpu_memory_utilization: "$${BFCL_GPU_MEMORY_UTILIZATION}"
              # The step appends experiment and eval_name to this, so the results
              # land under the run directory with everything else.
              output_dir: "$${WORKDIR_ROOT}/$${RUN_NAME}/$${BUILD_SUBDIR}/eval-bfcl-baseline"
            launcher_config:
              resources:
                accelerators: "H100:$${BFCL_NUM_GPUS}"
                cluster: "$${CLUSTER}"
                zone: "$${QUEUE}"
                memory: $${GPU_MEMORY}

<% for N in CKPT_LADDER.split(",") %>
