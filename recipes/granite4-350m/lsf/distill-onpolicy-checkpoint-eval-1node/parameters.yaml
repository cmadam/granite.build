# distill-onpolicy-checkpoint-eval-1node — distill-onpolicy-checkpoint-eval with the
# trainer on ONE 8-GPU node instead of two (GOLD_NUM_NODES 1, grad_accum 6, so the
# effective batch is still 96). It exists because of how long the two-node trainer
# waits in the queue; see GOLD_NUM_NODES. RUN_NAME, EXPERIMENT and the mem:// URIs
# carry a -1node suffix, so its results and artifacts never collide with the parent's.
# Everything else is the parent's, and the recipe test asserts that.
#
# distill-onpolicy-checkpoint-eval — ON-POLICY GOLD distillation of the granite-4.0-350m
# student towards a granite-4.1-3b teacher, starting from the off-policy step-2,000
# checkpoint (c2000), with every checkpoint exported and fully evaluated as it is written.
# BlueVela.
#
# This is distill-checkpoint-eval with three things changed and one added:
#
#   * STUDENT_MODEL is c2000 -- export-2000 of build 1e2e969e -- not the SFT checkpoint;
#   * LMBDA is 0.25 instead of 0, with distill-onpolicy-v2's vLLM server and teardown;
#   * the horizon is 2,500 steps (GOLD_MAX_STEPS) with a 500-step ladder, not one epoch;
#   * GOLD_DATA_SEED reseeds the trainer's data sampler, because c2000 trained on this
#     very corpus at this very geometry and a fresh run would otherwise replay it.
#
# Everything else -- the pair, the pinned corpus, the objective (beta 0.5, no CE anchor),
# the geometry (effective batch 96), the LR schedule, MAX_LENGTH, the full 27-eval suite
# -- is c2000's. A rung here is therefore comparable to c2000's own row and to the
# off-policy rungs after it (c3000, c4000 ...): the one thing that differs is where a
# quarter of the training sequences come from.
#
# WHAT THIS RUN IS FOR: whether on-policy distillation buys anything past the point where
# the off-policy objective stopped paying. The ladder report
# (distillation-reports/20260929-1019) found 73% of the epoch's capability lift present by
# step 1,000 and the index flat after; the 30B-reference report (20260930-1239) put c2000
# ahead of that reference's final checkpoint on 11 of 13 axes. Off-policy past 2,000 bought
# GSM-Symbolic and Minerva and nothing else. On-policy is the variable that is left.
#
# NOTHING GATES THIS RUN, as in distill-checkpoint-eval: gen-smoke has no exit gate, the
# entropy guard is off, and no target is gated on an eval-transfer number. One thing is
# different and worth knowing before launching: the immediate-EOS collapse the generation
# floor would prevent is UNMITIGATED at the step's trainer pin (MIN_COMPLETION_LENGTH
# below). Read rung 500 -- its eval-transfer entropy, its full-eval row -- as it lands,
# while there is still a run to cancel.
#
# BEFORE LAUNCHING: OE_EVAL_BCB_API_URL (bcb-server must be up, or one of the 27 evals
# fails on every rung). The README has the cost table, the launch order and a
# minutes-long shakedown configuration.
#
# Override any value with: gb build start --param KEY=VALUE

# ─── Run identification ───────────────────────────────────────────────
RUN_NAME: "distill-350m-onpolicy-c2000-1node"
# The shared root every composed path hangs off. Absolute, and that is forced
# rather than chosen: the eval targets have to name the corpus split, and each
# target run gets its own GB_BUILD_WORKDIR. Its own directory under gbtest so a
# distillation run's artifacts can be found and cleaned up as a set.
# NOT under gbtest: this run's checkpoints are the deliverable, not scratch. The
# smoke tier stays under gbtest; this does not.
WORKDIR_ROOT: "/proj/granite-build/g4os/distill"
# One directory per BUILD under that root, and this is a correctness setting
# rather than tidiness.
#
# gbserver refuses to register an artifact whose URI another build in the space
# already registered ("Same artifact URI found in space ... for another build").
# The target that emitted it still reports SUCCESS — with an EMPTY output list.
# Nothing downstream notices until a retry or a restart, where reuse replays each
# skipped target's stored outputs as bindings: a target with no stored outputs
# propagates nothing, its consumers never become ready, and the build reports
# SUCCESS having silently skipped them. That is what build b5f030cd did — it
# reported SUCCESS with eval-transfer still FAILED and eval-bfcl never started.
#
# run_metadata.build_id is filled by gbserver per step, and every target in one
# build fills the same value, so the root stays shared within a build. The Jinja
# stays literal in this file: the CLI's parameter pass uses different delimiters
# and leaves it alone.
#
# The cost is that align and corpus re-run on every build (~4 minutes) instead of
# resuming from a previous one. Pin this to a fixed string to deliberately share a
# directory across builds — and expect the artifact collision above.
BUILD_SUBDIR: "{{ run_metadata.build_id }}"
SEED: 42

# ─── Reusing an existing corpus ───────────────────────────────────────
# Empty means "build the corpus in this build", which is what every run before
# this parameter did: `sources` reservoir-samples the three SFT splits and
# `corpus` prepares them. Together that is ~50 minutes on the CRITICAL PATH --
# train-gold cannot start until it finishes -- and it is deterministic. The
# CE_COEF sweep proved it: the three arms that completed (9dab9130, 8c8ebd63,
# c20ed3c0) wrote byte-identical sources/train.jsonl, corpus/train.jsonl and
# corpus/eval.jsonl. A four-arm sweep therefore paid for the same file four times.
#
# Set this to an existing corpus directory and `sources` and `corpus` do not run
# at all; the consumers read that directory DIRECTLY as a `uri` input instead of
# through a `binding`. Direct is the only form that works across builds:
#
#   * gbserver's target reuse is scoped to ONE build id (docs/builds/target-reuse.md
#     is explicit that cross-build reuse is intentionally unsupported), so it only
#     ever helps a retry -- and RUN_NAME is in the corpus out_dir, so a per-arm
#     RUN_NAME changes the definition hash and defeats even that;
#   * pinning BUILD_SUBDIR instead would make the second build re-register a URI
#     the first already owns. That is the b5f030cd mode: gbserver refuses the
#     registration, the target still reports SUCCESS with an EMPTY output list,
#     and every consumer waits forever for a binding that will never resolve;
#   * a `binding` names another target's output IN THIS BUILD, so it cannot name a
#     corpus that a different build produced.
#
#   --param CORPUS_DIR=/proj/granite-build/g4os/distill/<run>/<build-id>/corpus
#
# The directory must hold train.jsonl, eval.jsonl and corpus_manifest.json.
#
# The corpus is DEFINED by the retagged tokenizer and by the prep policies, so a
# pin taken from a run with a different teacher, a different max_length or a
# different think/documents policy would train on a corpus this build does not
# describe -- and nothing downstream would say so. That is the one new silent
# failure mode pinning introduces, so corpus-pin-check reads the manifest and
# fails before any allocation is held. It is CPU-only and takes seconds.
#
# PINNED BY DEFAULT HERE, unlike distill-checkpoint-eval, and pinned to the corpus c2000
# trained on: df8512e0's, which is what build 1e2e969e's corpus-pin-check accepted
# (782,388 train / 3,932 eval rows). Two reasons, both about comparability rather than
# cost. The held-out split has to be c2000's, or eval-transfer-<N> here and
# eval-transfer-2000 there are divergences over different rows. And the train split has
# to be c2000's, or GOLD_DATA_SEED below is reseeding a different corpus and the
# on-policy arm differs from its init in two ways at once. Set it to "" to rebuild.
CORPUS_DIR: "/proj/granite-build/g4os/distill/distill-350m-stage1/df8512e0-be93-4762-85ad-813d9080d72f/corpus"

# ─── The SFT arm ──────────────────────────────────────────────────────
# Off by default: the shortest path through the pipeline is the one to prove
# first. Turn it on with --param INCLUDE_SFT=true and a plain-SFT pass runs
# between align and GOLD, with GOLD continuing from the SFT checkpoint rather
# than from the aligned student.
#
# The build.yaml tests this against the string forms as well as the booleans,
# because `--param INCLUDE_SFT=false` delivers the STRING "false" (the CLI does
# no YAML parsing of parameter values) and a bare Jinja truth test on a non-empty
# string is true — which would turn the arm on while the command line said off.
INCLUDE_SFT: false

# ─── Image and trainer code ───────────────────────────────────────────
# One image for every distillation step (each step's own default is this same
# image; naming it here makes the pin visible and overridable in one place). The
# BFCL target is deliberately NOT given it — that step runs its own harness
# image.
# SM90 (H100) build; it will not run on A100.
IMAGE_ID: "docker:us.icr.io/cil15-shared-registry/kd-sandbox-distill:0.1.0-uv"
# The GOLD trainer: the step's own public pin, which is the default again.
#
# EMPTY means the step clones github.com/laminair/gb-steps-distillation at the commit
# its own code_config pins, which resolves on any environment class that can reach
# github.com. This recipe used to override it with a local checkout at
# /proj/granite-build/g4os/gb-steps-distillation-gb carrying
# patches/ce_anchor_and_entropy_guard.diff, because CE_COEF and the entropy guard need
# trainer fields the public pin does not define. Both are off now -- see CE_COEF below
# for the sweep that retired them -- so nothing patch-gated renders, the override has
# no purpose left, and this recipe runs the same trainer as every other distillation
# recipe here, on any cluster rather than only on BlueVela.
#
# To re-arm either key, point this at a checkout carrying that patch and set
# CODE_EXPECT_REF to its HEAD; the diff header states its base commit and the directory
# remap it needs. render_gold_config.py refuses to emit a patch-gated key against a
# trainer whose CustomGOLDConfig lacks the field, so the wrong combination fails in
# seconds instead of after the allocation is held.
CODE_DIR: ""
# The full 40-char commit CODE_DIR must be at, and be clean at. Consulted ONLY on the
# CODE_DIR path: the clone path checks out code_config.ref by construction, so there is
# nothing there for this to catch. Empty is therefore the right value while CODE_DIR is
# empty, and the value to fill in the moment one is set -- it is what turns a mutable
# shared checkout back into a recorded provenance, and it brings the dirty-tree check
# with it.
CODE_EXPECT_REF: ""
DS_CONFIG: "steps/distill-gold-train/configs/deepspeed/accelerate_deepspeed_zero3.yaml"
# The five ported steps read their own code from a separate pinned checkout,
# declared by each step's code_config (code_dir plus expect_ref) rather than
# here — so a source bump is one edit in the step, not one per recipe.

# ─── The pair, the data, and the chat template ────────────────────────
# granite-4.1-3b, via a PINNED-TOKENIZER copy rather than the model directory.
#
# That indirection is the difference between this pair and the reference one. Both
# granite-4.0-350m and granite-4.1-3b ship tokenizer_config.json declaring
# tokenizer_class GPT2Tokenizer over a tokenizer.json whose pre_tokenizer is the
# trained Sequence[Split(regex), ByteLevel] — and AutoTokenizer honours the class,
# imposing a plain ByteLevel and discarding the Split. It does not error; it
# mis-segments (26.1 vs 3.29 PPL/token, measured upstream). In the reference pair the
# 30B teacher's pre_tokenizer was ALREADY plain ByteLevel, so the override was a no-op
# on the teacher side and align only had to fix the student. Here it bites both, and
# align fixes only the student — so the teacher needs its own pinned copy, built once,
# out of band. The README has the command.
#
# The two tokenizer.json files are byte-identical (sha256 match, 7,153,421 bytes), so
# once both are pinned there is no cross-tokenizer problem left: this is the
# shared-vocabulary JSD path, which is the only path the step exposes.
TEACHER_MODEL: "/proj/granite-build/g4os/models/granite-4.1-3b-pinned"
# c2000: export-2000 of distill-checkpoint-eval build 1e2e969e
# (distill-350m-ckpt-eval-20260929, rung ckpt_2000). The SFT checkpoint plus 2,000 steps
# of off-policy GOLD against this same teacher, on this same corpus.
#
# The EXPORT, not the trainer's raw checkpoint-2000: it is what full-eval measured, so the
# model this run starts from is the model whose 27-benchmark row it is compared against.
# Its config.json carries the top-level rope_theta 10,000,000 (checked 2026-10-02) -- the
# field whose loss made vLLM serve granite-4 at RoPE 10k and produced BFCL 0.000. That
# matters twice here, because vllm-server serves this model for rollout.
#
# Starting from the export also means a FRESH optimizer: the Adam moments c2000 had built
# up are not in it. WARMUP_RATIO below is what absorbs that.
#
# granitemoehybrid, like the SFT checkpoint it came from; align on an already-aligned
# export is a no-op (reuse_in_place=100352 moved=0, build b2d37592).
STUDENT_MODEL: "/proj/granite-build/g4os/distill/distill-350m-ckpt-eval-20260929/1e2e969e-0a26-46f2-be2b-74e351e6ca24/export-2000"
# The three SFT splits, raw. These are the ANCESTOR of the mixture the SFT stage
# trained on: datasets/tokenized/{general,tools,rag}/data.jsonl have exactly the same
# row counts as these (4,311,969 / 710,290 / 59,245 -- verified 2026-09-22), and
# tokenized/all_combined is their merge. So stage 1 distills over the same text the
# baseline was trained on, which is what keeps the comparison clean.
#
# Two properties of these files drive the `sources` target, and both would fail
# silently if ignored:
#   - the rows are spelled `conversations`, not `messages`, and prep drops anything
#     without `messages` as no_messages -- all 5,081,504 of them;
#   - the splits are 84.86% / 13.98% / 1.17%, and prep's max_examples stops after N
#     kept rows IN INPUT ORDER, so a concatenation plus a cap yields pure `general`.
SOURCE_GENERAL: "/proj/granite-build/g4os/datasets/ibm-granite--granite-4.0-sft-datasets-r260106a/general/general.jsonl"
SOURCE_TOOLS: "/proj/granite-build/g4os/datasets/ibm-granite--granite-4.0-sft-datasets-r260106a/tools/tools.jsonl"
SOURCE_RAG: "/proj/granite-build/g4os/datasets/ibm-granite--granite-4.0-sft-datasets-r260106a/rag/rag.jsonl"
# How many rows to sample across the three, proportionally to their sizes. 0 means
# the whole corpus.
#
# THIS IS THE COST KNOB, and the default is a deliberate fraction rather than a full
# epoch. One epoch over all 5,081,504 rows is 52,932 optimizer steps at effective
# batch 96 and an estimated 365-729 GPU-h -- 2 to 4 days on eight H100s. 800,000 rows
# is 8,333 steps and an estimated 57-115 GPU-h, and it is roughly the scale of the
# reference sweep's corpus (802,027 rows), which makes the two comparable.
#
# A subset is defensible on merit, not just on budget: the student has already seen
# ALL of this text twice under hard labels. What is new in stage 1 is the teacher's
# distribution over it, and that is learnable from a representative sample -- the
# published sweep reported its headline result after 100 steps. Raise it with one
# --param when the first run says the objective is working.
#
# INERT while CORPUS_DIR is set (the default here): `sources` does not render. Kept at
# c2000's value so clearing CORPUS_DIR rebuilds the same corpus.
TARGET_ROWS: 800000
# Seeds both the per-split reservoir sampling and the interleave, so the exact corpus
# is reproducible from this number alone.
SHUFFLE_SEED: 42
# ABSOLUTE, and granite-native. run-align.sh only prefixes the steps' code_dir when
# the value is relative, so an absolute path needs no step change.
#
# This is granite-4.0-350m's OWN chat template with {% generation %} markers added
# around the assistant span and nothing else changed — derived from the student's
# template rather than the teacher's on purpose, because the two differ: the 350m
# template injects a default system message when none is given and the 3b one does
# not. full-eval renders prompts with the model's own template, so deriving from the
# teacher's would change every prompt relative to the SFT run whose eval row is the
# baseline.
#
# The markers emit nothing, so the rendered output is byte-identical to the
# unmarked template. That is asserted, not assumed:
# steps/distill/distill-tokenizer-align/skypilot/test/test_granite_role_template.py renders
# both over nine conversation shapes and diffs them.
#
# BEFORE THE FIRST RUN: diff this against /proj/granite-build/g4os/chat_template.jinja,
# the template the SFT mixture was actually tokenized with. The vendored base is the
# Hub's copy of granite-4.0-350m's template, which SHOULD be the same file — but "should
# be" is not "is", and a difference here moves every prompt. The README has the command.
CHAT_TEMPLATE: "/proj/granite-build/g4os/chat_templates/granite_4_role_generation.jinja"
# FALSE, and only safe because CHAT_TEMPLATE above is granite-native.
#
# align's stage 1 of 4 demands ChatML of the teacher, unconditionally upstream. No
# granite 4.x model has <|im_start|> in added_tokens_decoder — the raw backend returns
# it as the six bytes [27, 91, 318, 5011, 91, 29] — so a granite-4.1 teacher aborts
# there under the default, with a message about ChatML rather than about the pair.
#
# False does NOT leave the turn boundary unchecked: align stage 4 of 4 derives the
# masking contract from the installed template and fails the step if it cannot, and
# verify()'s pre_tokenizer half — the half that catches the mis-segmentation above — is
# family-independent and runs either way.
REQUIRE_CHATML: false
THINK_POLICY: "keep"

# ─── The corpus ───────────────────────────────────────────────────────
# 0: no cap. The subset is chosen in the `sources` target instead, by TARGET_ROWS,
# because that is the only place it can be done proportionally -- max_examples stops
# after N kept rows in INPUT order, which on an 84.86% `general` corpus means a cap
# here would silently drop tools and rag entirely.
MAX_EXAMPLES: 0
# 0.5%: ~4,000 rows held out of 800,000. eval-transfer draws EVAL_MAX_SAMPLES from
# this split, so it only has to be comfortably larger than that -- and every row here
# is a row the trainer does not see.
EVAL_FRACTION: 0.005
# ONE budget for prep, the trainer and both evals. 8192, not the smoke tier's 4096
# and not the reference's 16384: 8192 is what the SFT mixture was tokenized at
# (sft-eval-full-dataset's MAX_SEQ_LEN), so it is the length the baseline's rows were
# measured against. The student's max_position_embeddings is 32768, so 16384 would be
# legal and would buy nothing on this data.
MAX_LENGTH: 8192
# 32, not the smoke tier's 8: prep renders and tokenizes every one of the sampled
# rows, and at 800k that pool pays for itself many times over.
DATASET_NUM_PROC: 32
# KEEP, against the step's default of drop. The step drops rows carrying documents
# because "granite's chat template does not render documents" — which is not true of
# the template this pipeline installs: granite 4.x renders them into the system turn
# via documents_system_message_prefix. The default would silently discard grounded
# rows. Harmless on this fixture, which has none; set correctly here so stage 1
# inherits it rather than rediscovering it.
DOCUMENTS_POLICY: "keep"

# ─── GOLD ─────────────────────────────────────────────────────────────
# 2,500 on-policy steps from c2000, "to begin with". A step budget rather than an epoch
# for two reasons. An epoch is the wrong unit for a continuation: c2000 has already been
# through 192,000 of these rows, and what is being bought is on-policy steps, not coverage.
# And on-policy is the expensive half -- generation runs on every step, and the reference
# arms measured ~135 GPU-h on-policy against ~15 off-policy -- so the horizon should be
# chosen, not inherited from the corpus size.
#
# 2,500 is 240,000 rows at effective batch 96 -- 31% of the corpus -- and it is longer than
# the region where the off-policy run banked its gains (73% of the lift by step 1,000), so
# if on-policy has a comparable descent the ladder will see it and its shoulder.
#
# It is also what makes the last rung DERIVED rather than measured, which
# distill-checkpoint-eval could not have: with max_steps set the trainer's final step is
# exactly GOLD_MAX_STEPS, so the last rung is a multiple of the save grid by construction.
# The recipe test asserts the last rung equals this value.
GOLD_MAX_STEPS: 2500
# INERT: max_steps overrides num_train_epochs in the trainer. Kept because the renderer
# passes both and the trainer needs it present to build the schedule.
GOLD_NUM_TRAIN_EPOCHS: 1.0
# Which checkpoints are exported and evaluated. Drives the Jinja loops in build.yaml, so
# this list IS the target graph: five rungs means five export targets, five
# eval-transfer targets, and five x 27 eval targets.
#
# EVENLY SPACED at 500, because the question is the same as distill-checkpoint-eval's --
# where along the run the best model sits -- and a grid is the only shape that answers it
# without assuming the answer. 500 rather than that recipe's 1,000 because the run is a
# third the length and on-policy is the regime that might turn early: 500 is the first
# rung, and it is the reading that says whether the rest is worth paying for.
#
# Every rung must be a multiple of GOLD_SAVE_STEPS, and the last must equal
# GOLD_MAX_STEPS. Because the exports are bound to MID-RUN artifacts, a rung the trainer
# never writes is not a late error but a target that never dispatches. The recipe test
# asserts both.
#
# These are ON-POLICY step counts. ckpt_500 is c2000 + 500, i.e. 2,500 steps of training
# in total -- compare it with c2000's own column, not with the off-policy run's ckpt_500,
# which does not exist.
CKPT_LADDER: "500,1000,1500,2000,2500"
# Every 500 steps, and KEEP THEM ALL: the grid is the ladder, so every checkpoint written
# is one that is exported. 8 rather than 5 so a resume, or an extra save, cannot start
# evicting a rung a bound export is waiting for. The recipe test asserts limit >= rungs.
GOLD_SAVE_STEPS: 500
GOLD_SAVE_TOTAL_LIMIT: 8
# The trainer's data SAMPLER seed, and the reason this recipe needed a step change.
#
# c2000 trained on the pinned corpus above, at effective batch 96 on 2 x 8 GPUs, with the
# sampler seeded from HF Trainer's default `seed` 42 -- the step never rendered a seed. A
# fresh run from c2000 at the same corpus, geometry and seed draws the same permutation, so
# its steps 1-2,000 would be c2000's 192,000 rows again in the same order. Three quarters
# of every batch would be a second pass over text the model has already fitted, and an
# on-policy gain would be indistinguishable from a second-look gain.
#
# Any value other than 42 gives an independent permutation; the first 240,000 rows of it
# then overlap c2000's 192,000 at the base rate, 192,000 / 782,388 = 24.5% (~59,000 rows),
# instead of 80%. distill-gold renders this as data_seed, which reseeds the sampler and
# nothing else -- `seed`, and with it everything else the trainer seeds, stays 42.
#
# -1 omits the key and restores the replay.
GOLD_DATA_SEED: 43
# Effective batch = per_device x grad_accum x nodes x gpus = 2 x 6 x 1 x 8 = 96.
#
# ONE NODE, so grad_accum is 6 where the two-node parent has 3: the same 96, the same
# per-device batch of 2 and so the same per-GPU logits memory, at roughly twice the
# wall-clock per step.
#
# 96 rather than the reference's 192: that was tuned for a 3B student at 16384
# context, and 96 sits nearer the 350m's own SFT geometry (4 x 2 x 8 = 64), whose LR
# schedule this student's optimum came from.
#
# HOLD THE PRODUCT when changing the node count. Two nodes at grad_accum 3 and one
# node at grad_accum 6 are the same optimization at different wall-clock; 2 nodes at
# grad_accum 6 is a DIFFERENT run that happens to finish in the same time. The
# recipe test asserts the product, not the factors.
GOLD_PER_DEVICE_TRAIN_BATCH_SIZE: 2
GOLD_GRADIENT_ACCUMULATION_STEPS: 6
# Quote the scientific-notation values. Unquoted, PyYAML loads 1.0e-05 as a float
# whose repr is "1e-05", which is then re-read from the rendered build.yaml as a
# STRING.
# 2e-6, a fifth of the reference recipes' 1e-5, because the student is a CONVERGED
# SFT checkpoint rather than a base model. The gold recipes' schedule was tuned for a
# base student with everything to learn; at that peak a converged model is knocked off
# its optimum before the teacher's soft labels do anything useful, and the baseline
# row is what it would be knocked away from. Irrelevant at two steps — set here so
# stage 1 inherits a schedule that was chosen rather than copied.
#
# UNCHANGED from c2000's run, and that is a choice rather than an inheritance. c2000 left
# its run at ~1.8e-06 (step 2,000 of an 8,150-step cosine with 408 warmup steps), so a
# peak of 2.0e-06 continues at about the rate it stopped at rather than re-heating the
# model. The warmup restarts from zero over 125 steps (5% of 2,500), which is what the
# fresh optimizer needs -- see STUDENT_MODEL.
GOLD_LEARNING_RATE: "2.0e-06"
GOLD_MIN_LR: "2.0e-07"
WARMUP_RATIO: 0.05
LR_SCHEDULER_TYPE: "cosine_with_min_lr"
# The rollout budget: the student generates at most this many tokens per on-policy
# sequence. Unchanged from c2000's run, where it was inert at lmbda 0.
MAX_COMPLETION_LENGTH: 2048
# Sampling temperature for the student's rollout, and the softmax temperature of the
# divergence. Unchanged from c2000's run.
TEMPERATURE: 1.0
# 0.25: one generated sequence in four, three from the corpus.
#
# Not higher, for two reasons that both come from this pair rather than from taste.
# Generation is the expensive half -- the reference on-policy arm runs ~135 GPU-h against
# off-policy's ~15 -- and it is also the half that can feed a collapse, since a student
# trained on its own degenerate output has no corpus token pulling it back. A quarter
# buys the exposure-bias correction on-policy exists for while three quarters of every
# batch is still real text. Raise it only after an arm at 0.25 has been read -- and
# this is the first one.
#
# The trainer must never reach lmbda 0 with a server allocated, and the renderer refuses
# that combination: at lmbda 0 the student never generates, so the server would be held
# and never used.
LMBDA: 0.25
# constant, or linear to ramp from LMBDA_INIT up to LMBDA across training: off-policy
# early where the corpus signal is, on-policy later where the student's own distribution
# is what matters.
#
# NEVER RUN in this pipeline. lmbda_schedule is a trainer key this repo had not exposed
# before v2, so the ramp is untested plumbing -- smoke it before spending a real
# allocation on it. The constant arm is the one to read first anyway: a ramp confounds
# "on-policy helped" with "on-policy helped once the student was further along".
LMBDA_SCHEDULE: "constant"
LMBDA_INIT: 0.0
# The generation floor, in tokens, and it is set on BOTH the trainer and the server
# because they are different settings: the trainer's bounds what it asks for, the
# server's is where the sampling decision is taken. trl's vllm_serve has no min_tokens
# field, so run_vllm_serve.py patches SamplingParams from GOLD_MIN_TOKENS, which the
# vllm-server step exports from its own min_completion_length.
#
# 0 MEANS THERE IS NO FLOOR, AND THAT IS THE STATE OF THE PINNED CODE RATHER THAN A
# PREFERENCE. Neither half of this setting exists at the step's pin, checked against the
# public repo at a5d59bc4 on 2026-09-28:
#
#   * the TRAINER half needs CustomGOLDConfig.min_completion_length, which is absent --
#     and ce_anchor_and_entropy_guard.diff does not add it either, so unlike the CE anchor
#     there is no patched checkout that would carry it;
#   * the SERVER half, which is where the sampling decision is actually taken, needs
#     run_vllm_serve.py to read GOLD_MIN_TOKENS and patch SamplingParams.min_tokens. That
#     file at the pin is 108 lines and mentions none of the three.
#
# So a non-zero value here does not buy a floor, it buys two failures: train-gold refused by
# render_gold_config's field check, and vllm-server refused by its own GOLD_MIN_TOKENS grep.
# Both are loud and both land before the allocation -- the step's own message says to "set
# min_completion_length 0 and accept that there is no floor", and that is what this does.
#
# WHAT IS NOW UNMITIGATED. The failure the floor prevented is an immediate EOS: an empty
# completion is a rollout the teacher scores as if it were one, and the run becomes an
# expensive way to score nothing. Nothing in the pinned code stops that, so it has to be
# READ instead. gen-smoke reports per rung but runs only after the last export, so the
# early read here is rung 500's eval-transfer entropy and its full-eval row (IFEval and
# the generation-heavy suites fall first on empty completions), both mid-run. Watch the
# first rung before letting the rest of the run spend.
#
# To restore a real floor, both halves have to land in gb-steps-distillation and the pin has
# to be bumped; a recipe parameter cannot do it alone.
MIN_COMPLETION_LENGTH: 0
# ─── The vLLM server ──────────────────────────────────────────────────
# An EXTERNAL server in its own allocation, which is the topology that has actually run
# (build 9973e766 synced all 362 parameter tensors across two allocations). The
# in-allocation split that vllm_num_servers alone selects passes no --vllm_server_host,
# leaving the trainer looking for a server on a different node.
VLLM_MODE: "server"
# Weight sync every optimizer step. The served copy goes stale the moment the student
# updates, and a stale server generates from a model that no longer exists -- which is
# off-policy training wearing on-policy's costs. ~1.5 s against ~5 s of generation when
# this was measured, so every step is affordable.
VLLM_SYNC_FREQUENCY: 1
VLLM_PORT: 8001
# TWO GPUs, not eight. The student is 350m: the reference recipes serve a 3B student and
# sized this for that. Data-parallel across 2 is ample and leaves six H100s in the pool.
VLLM_NUM_GPUS: 2
VLLM_HEALTH_TIMEOUT_SECONDS: 1800
# The server's own ceiling on holding its allocation, and the backstop for the one hole
# in teardown: that target is gated on train-gold.checkpoint, which a CRASHED trainer
# never emits, and gbserver's schema has no on-failure semantics. Build d77546a9 held 8
# H100s that way until they were downed by hand.
#
# 36 h, not the two-node parent's 24 h, because this trainer has half the GPUs. The
# clock starts when the server comes up, right after align -- BEFORE the trainer's 1 x 8
# H100 allocation has cleared the queue -- and has to cover that wait plus the run. The
# run itself has never been measured: off-policy on this pair ran 13h20 for 8,150 steps
# on 2 x 8 (5.9 s/step), on-policy at lmbda 0.25 is budgeted at 2-3x that, and one node
# doubles it again, so 2,500 steps is ~16-25 h. 36 h covers 3x with ~11 h of queue and
# startup to spare. The cost of that margin is the failure case: a crashed trainer
# strands 2 H100s for up to 36 h unless the cluster is downed by hand (or the cluster's
# 2 h idle-GPU kill gets there first). The recipe test asserts the ceiling covers 3x the
# off-policy step time on half the GPUs.
VLLM_MAX_LIFETIME_SECONDS: 129600
# Nucleus sampling for the student's rollout. Generation-time only; it does not touch
# the divergence, which is computed over full distributions.
TOP_P: 0.95
# The sampled-OPD (REINFORCE-style) arm stays OFF: it is a different objective, and this
# recipe changes one thing from stage 1 v2, namely where the sequences come from.
USE_SAMPLED_OPD_LOSS: false
LAST_MESSAGE_ONLY: false
CLIP_ALPHA: 0.1
OPD_IMPORTANCE_SAMPLING: false
# 0.5 => a genuine JSD mixture. The trainer short-circuits 0.0 to forward KL and 1.0
# to reverse KL, so 0.5 is the only one of the three that actually mixes, and it is
# what the reference sweep's arms ran.
#
# It is the right default for THIS pair rather than a copied one: the student has an
# eighth of the teacher's hidden size and a different architecture class, so it cannot
# represent the teacher's distribution and has to choose what to cover. That is what
# reverse KL's mode-seeking half buys, and forward KL alone would spread a 350M
# student thin across modes it cannot afford.
BETA: 0.5
# ─── The CE anchor and the entropy guard: both off ────────────────────
# OFF, AND THAT IS A RESULT rather than a default awaiting a value.
#
# The CE sweep is complete at four coefficients (0 / 0.05 / 0.15 / 0.40, read at step
# 25 and step 300, 2026-09-28) and the dose-response is monotone-bad on two suites that
# share no items. At step 300, as the coefficient rises: ifeval gain
# +5.57 -> +4.04 -> +2.71 -> +2.56, and HumanEval +1 -> 0 -> -3 -> -9 problems. No
# pairwise gap in that grid clears its own noise band -- the ORDERING is the finding,
# and it has no interior optimum. ce015 was the last candidate for a usable middle and
# it sits exactly where the trend predicts, so further rungs on this axis are not worth
# GPU-hours.
#
# And the collapse the anchor was written to prevent turned out to be harmless.
# df8512e0 did lose 42% of its student entropy over one epoch; once its export was
# repaired (the dropped top-level rope_theta, fixed 2026-09-27) that same checkpoint
# beat its own SFT baseline -- GSM8K +10.7, ifeval +7.4, Minerva +4.0, MGSM +3.1, with
# HumanEval and BFCL level. The premise these keys were added under, "the objective is
# wrong", is withdrawn. Longer, unanchored, off-policy is the best recipe on record.
#
# THE KEYS STAY, AT ZERO, rather than being deleted. Zero is what lets this recipe run
# on the step's own public trainer pin: render_gold_config.py emits each of them only
# when non-default, and emitting any one against a trainer that lacks the field makes
# TrlParser reject the config on every node after the allocation is already held. And
# the sweep left one question open -- no CE arm was ever measured for safety, which is
# the only axis where the unanchored epoch went backwards (SALAD 93.5 -> 90.7, AttaQ
# -1.2). If that experiment is run, it is --param CE_COEF=<x> plus a CODE_DIR pointing
# at a patched checkout, and nothing else.
#
# loss = JSD(student || teacher) + CE_COEF * CE(student, corpus tokens)
CE_COEF: 0.0
# Mean student entropy and reverse KL in the trainer log, every logging_steps.
#
# FALSE for pin reasons, not because the metric stopped mattering. It is one of the six
# patch-gated fields, so leaving this true alone would hold CODE_DIR at a patched
# checkout for an instrument. The quantity survives without it: distill-eval computes
# entropy and rkld from a checkpoint with no trainer involvement (see EVAL_METRICS
# below), and the eval-transfer targets read every checkpoint this recipe exports. What
# is lost is resolution WITHIN a run, not the measurement.
LOG_STUDENT_ENTROPY: false
# 0 disables the guard, and disabling it changes no behaviour: ENTROPY_GUARD_ACTION has
# been "warn" for as long as there has been a ladder, so the guard has only ever printed
# the trip step and never ended a run. With the collapse now known not to damage the
# model there is nothing left for it to warn about, and it is patch-gated like the two
# keys above.
ENTROPY_GUARD_DROP_FRAC: 0.0
# INERT while ENTROPY_GUARD_DROP_FRAC is 0 -- the renderer emits this trio only when the
# fraction is positive. Left at the values every sweep arm ran with, so re-arming the
# guard alongside a CE arm is one --param and not a reconstruction.
ENTROPY_GUARD_BASELINE_STEPS: 20
ENTROPY_GUARD_PATIENCE: 3
# "warn" rather than "stop", still, and for the same reason as before: a laddered recipe
# wants the whole curve, and the trip step is the least useful place to end a run. Inert
# while the fraction above is 0.
ENTROPY_GUARD_ACTION: "warn"

# granite's logits_scaling=10 overflows the fused bf16 JSD kernel and yields NaN
# loss, so false is the setting known to produce a finite loss here. The cost is
# memory: the non-fused path materialises the [batch, seq, vocab] logit tensor.
USE_LIGER_FUSED_JSD: false
# The granite 4.x assistant marker, and note what is NOT here: a trailing newline.
#
# The reference recipes carry '<|im_start|>assistant\\n' with a DOUBLED backslash,
# because ChatML puts a line boundary after the role header, that boundary is where
# loss masking begins, and gbserver fills every config string through a Jinja
# environment built without keep_trailing_newline — which strips exactly one real
# trailing newline per value. Build d8470f14 lost one that way and trained two steps
# against a span one token off while reporting success.
#
# granite 4.x closes its role header with <|end_of_role|> and puts nothing after it,
# so there is no boundary to smuggle and the whole apparatus is inert here: no
# backslash for printf '%b' to reinterpret, nothing for the fill to strip. Single
# quotes are kept because the value contains | and <.
#
# It must still be stated explicitly in every target: render_gold_config.py defaults
# it to <|im_start|>assistant, and a wrong marker matches nothing, leaves every label
# at ignore_index, and trains on NOTHING while producing a loss curve and checkpoints.
RESPONSE_TEMPLATE: '<|start_of_role|>assistant<|end_of_role|>'

# ─── The SFT stage (only read when INCLUDE_SFT is on) ─────────────────
# Same learning rate as GOLD, so the two stages differ in the OBJECTIVE rather
# than in the optimiser.
SFT_LEARNING_RATE: "1.0e-05"
SFT_NUM_TRAIN_EPOCHS: 1
# Inherited from the smoke tier and NOT sized for this corpus: the SFT arm is off
# here (INCLUDE_SFT false) and would be a full pass over 800,000 rows on one GPU if it
# were switched on. Off here for a second reason too: the student is c2000, which has
# already had its SFT. Left as the reference geometry rather than silently rescaled, since
# the arm this recipe wants is the one that does not run.
SFT_PER_DEVICE_TRAIN_BATCH_SIZE: 1
SFT_GRADIENT_ACCUMULATION_STEPS: 8
SFT_NUM_GPUS: 1

# ─── Export ───────────────────────────────────────────────────────────
# No EXPORT_CHECKPOINT here, unlike distill-stage1: CKPT_LADDER names every
# checkpoint to export, so nothing is left to "highest step number" -- which for a
# guard-stopped run is whatever step the guard happened to fire on, and therefore a
# different checkpoint in each of the two arms.
# Which generation prompt the PUBLISHED model hands out when a consumer says
# nothing about thinking. keep, because this corpus is think-filtered at the
# SOURCE rather than stripped by prep: the student's labelled spans carry no
# empty <think></think> prefix, so there is nothing for a default-off policy to
# compensate for.
CHAT_TEMPLATE_THINKING: "keep"

# ─── The generation smoke test ────────────────────────────────────────
# The cheap read that df8512e0 did not have: greedy completions from every exported
# rung, scored for repetition.
#
# What is scored is the fraction of generated lines sitting inside a run of three or
# more IDENTICAL consecutive lines -- not the adjacent-pair rate the post-mortem
# quotes (0.4% Java baseline against 20.8% collapsed). The adjacent-pair rate is still
# reported per rung, because those recorded figures are the only prior art, but it
# cannot gate: a CORRECT 7-line Java function scores 0.167 on it, since two dedented
# closing braces are legitimately identical and one collision out of six pairs is 17%.
# Gating on it would fail healthy checkpoints. Measured on the post-mortem's own two
# samples, the run-based metric gives 1.00 collapsed against 0.00 correct.
#
# 0.15 as the ceiling: generously above zero for the odd genuine triple, far below the
# 1.00 a collapsed model produces. A rung above it is flagged `degenerate` in the
# report; no rung fails the target here.
GEN_SMOKE_MAX_REPETITION: 0.15
# Long enough for a loop to establish itself and be counted. The collapsed samples
# repeated a single line ~50 times, so 256 tokens is several times what is needed to
# see it, and eight prompts at 256 tokens on a 350m model is seconds per rung.
GEN_SMOKE_NEW_TOKENS: 256

# ─── The transfer evaluations ─────────────────────────────────────────
# All four metrics in one forward pass. entropy alone would not exercise the
# teacher-dependent reductions, which are the point of the step.
EVAL_METRICS: "jsd,kld,rkld,entropy"
# 8 of the 16 held-out rows. Proving the wiring, not producing a measurement.
# 256, the step's own default: this is a real read, not a plumbing check. Drawn with
# the seed rather than taken as a prefix.
EVAL_MAX_SAMPLES: 256
EVAL_BATCH_SIZE: 4
EVAL_DTYPE: "bfloat16"
# A record whose completion did not fit the budget cannot be scored. Above this
# fraction the step refuses rather than reporting a divergence measured on
# prefixes.
MAX_INCOMPLETE_FRACTION: 0.25
EVAL_NUM_GPUS: 1

# ─── BFCL ─────────────────────────────────────────────────────────────
# ONE category, not "all": the full suite is hours of generation and this recipe
# is asking whether the harness accepts the exported model at all. Expect a poor
# score — the model underneath it has taken two optimizer steps.
# ALL, not v2's "simple". v2 runs BFCL nine times as a cheap per-rung capability probe
# and picks the narrowest category to keep it at ~10 min. Here BFCL is one of the 27
# evaluations of the full suite, and full-eval runs it at all — so a row in combined.csv
# means the same thing as the corresponding row in the recorded baseline.
BFCL_TEST_CATEGORIES: "all"
BFCL_EVAL_NAME: "bfclv3"
# The harness's own model handler name, which is what selects the prompt format.
# NOT the run name: an unrecognised handler makes BFCL fall back and score a
# differently-formatted prompt.
BFCL_MODEL_ID: "ibm-granite/granite-4"
BFCL_NUM_GPUS: 1
BFCL_GPU_MEMORY_UTILIZATION: "0.5"

# ─── Topology and resources ───────────────────────────────────────────
# ONE trainer node. This is the whole difference from the parent recipe, which trains on
# two. Two nodes is a choice there, not a requirement: per-device memory is set by the
# per-device batch, which is unchanged, and grad_accum doubles to hold the effective
# batch at 96.
#
# Why a single-node variant exists: the vLLM server is its own LSF job, starts in about
# two minutes, and is then idle until the trainer clears the queue. BlueVela's policy
# kills a GPU job that has been idle for two hours (exit 130 at 2h01-2h03 on three
# on-policy builds, 2026-10-02), and granitebuild's fairshare priority in `normal` was
# 0.001. A 2 x 8 request needs two fully free hosts at the same moment; with about five
# open hosts free, it waited 32 min to 3.5 h+. A single 8-GPU host is much easier to get.
# The server still has its own allocation, so a wait over two hours still kills it.
#
# Raising this requires lowering GRADIENT_ACCUMULATION_STEPS to match.
GOLD_NUM_NODES: 1
GOLD_NUM_GPUS: 8
# HOST memory per node for the GPU targets, and it has to be stated: the LSF
# provisioner defaults to 16G, which killed an earlier build with TERM_MEMLIMIT
# at 46.5G — presenting as a cross-node NCCL hang, since a host-memory kill
# produces no CUDA OOM and no watchdog message.
GPU_MEMORY: 256
# align and corpus are CPU-only: a tokenizer retag and a tokenize-and-filter pass
# over 64 rows.
CPU_ONLY_CPUS: 1
CPU_ONLY_MEMORY: 32
# The export copies a 3B checkpoint and then loads it to verify.
# The `sources` target: CPU-only, but it holds the sampled rows in memory while it
# shuffles them, so ~800k rows of JSON needs real headroom.
SOURCES_CPUS: 8
SOURCES_MEMORY: 128
EXPORT_CPUS: 4
EXPORT_MEMORY: 64
CLUSTER: "bluevela"
# Where every target runs. One value rather than one literal per target, so moving this
# recipe to another environment (a gbspace-public one, say) is a one-line change.
ENVIRONMENT_URI: "space://environments/skypilot/lsf/ibm-bluevela"
# SkyPilot's `zone` is the LSF queue name for this cloud. `normal` is
# non-preemptable; an earlier sweep attempt died on the preemptable queue.
QUEUE: "normal"

# ─── NCCL / distributed diagnostics ───────────────────────────────────
# INFO, on by default rather than remembered at launch.
#
# Build 8f02b739 hung at step 219 in the ZeRO-3 parameter all-gather
# (_ALLGATHER_BASE, NumelOut=256,901,120) across two racks, and left NO trace to take
# to the cluster admins because NCCL_DEBUG was empty. It had to be cancelled and
# relaunched with the flag, paying 45-60 minutes of redone sources + align + corpus.
# A 2-node run is exactly the shape that hang needs, so the trace is not optional
# here. NCCL_DEBUG_SUBSYS below bounds the volume to ring/channel setup and the
# network plane.
NCCL_DEBUG: "INFO"
NCCL_DEBUG_SUBSYS: "INIT,NET"
# 10 minutes, not the reference hour: a smoke run wants a fast failure.
NCCL_TIMEOUT_MS: 600000
# Empty: the environment's nccl_tuning_file decides (it excludes the storage NICs
# mlx5_1 and mlx5_6). Every multi-node hang on record was preceded by an IB
# retry-exceeded error (status=12) on mlx5_8, always with a pod-6 host in the pair;
# "^=mlx5_1,mlx5_6,mlx5_8" drops that rail too, at ~1/8 of inter-node bandwidth.
NCCL_IB_HCA: ""

# ─── Retries ──────────────────────────────────────────────────────────
# One retry, for a measured cluster fault rather than as general insurance: host
# p2-r03-n1 takes an allocation and then fails inside torch at cuda_init with
# "CUDA unknown error" (3 runs, 3 failures there; 0 failures on every other host
# across several hundred runs in ~/sky_logs). A build.yaml cannot steer LSF away
# from a host, so running the target again — most likely elsewhere — is the only
# lever the recipe has. See README for the bsub host exclusion, which is the
# actual dodge, and report the node.
#
# Set to 0 to make a failure final, which is what you want while debugging a
# failure of your own rather than the cluster's.
MAX_RETRIES: 1

# ─── Resume ───────────────────────────────────────────────────────────
# Empty for a fresh run. To continue a run that stopped part-way, the stopped run's
# checkpoint directory -- .../builds/<build>/runs/<run>/checkpoints/<RUN_NAME>_node<N>.
# Every complete checkpoint-<N> there is hardlinked into the new run and the trainer
# resumes from the highest. Keep GOLD_NUM_NODES, GOLD_NUM_GPUS, the batch sizes and
# GOLD_MAX_STEPS as the stopped run had them: the step refuses a different world
# size, and nothing checks the schedule. The seeded rungs are emitted again, so their
# export and eval targets re-run.
RESUME_FROM_CHECKPOINT_DIR: ""
# true: the seeded rungs are announced again and their export/eval targets re-run,
# which is what a CKPT_LADDER still naming them needs. false: they are treated as
# already evaluated by the stopped run, so CKPT_LADDER must name only the rungs still
# to come (e.g. 2000,2500) -- a laddered rung that is never announced waits forever.
RESUME_EMIT_SEEDED: true

# ─── Monitoring ───────────────────────────────────────────────────────
# Short targets, so poll often enough to follow them.
POLL_INTERVAL_SECONDS: 30
# 120, and it is the OTHER HALF OF THE OVERLAP. The step's watcher prints an artifact
# line the moment a checkpoint is complete, but that line only reaches the build when
# the monitor next pulls the job's logs — so a rung's detection latency is
# CKPT_WATCH_INTERVAL_SECONDS plus this, and at worst ~4 min here. The step's own
# default of 900 would leave a rung unnoticed for a quarter hour of a 16-H100
# allocation. vllm-server's monitor reads the same value.
LOG_RETRIEVAL_INTERVAL_SECONDS: 120
# How often the in-run watcher lists the checkpoint directory. Cheap — a directory
# listing — but there is nothing to gain from going below the log-scrape interval above,
# since an earlier emission just waits longer to be pulled.
CKPT_WATCH_INTERVAL_SECONDS: 120
# How often each of the 135 eval targets has its job status polled. Bounds how soon an
# eval's completion is seen, and therefore how soon its rung's CSV can be written. Kept
# well below the steps' 900s default because a rung is only as finished as its slowest
# eval, and 135 targets each rounding up to 15 minutes adds up.
EVAL_STATUS_POLL_INTERVAL_SECONDS: 120

# ══════════════════════════════════════════════════════════════════════════════
# FULL-EVAL PER RUNG, AND THE ROLL-UP
#
# The 27 evaluations of recipes/granite4-350m/lsf/full-eval, run against all five
# rungs, then exported to one CSV per rung per eval kind and pivoted into a single
# benchmark x checkpoint table.
#
# THE COST, STATED PLAINLY: 5 x 27 = 135 eval targets, each one H100 on the
# preemptable queue, ~4 GPU-h per rung, ~20 GPU-h in total on top of an estimated
# ~130-200 GPU-h of training. They are independent and dispatch as their rung lands, so
# in wall clock they largely disappear into the run — but they are 135 LSF allocations,
# and the queue will feel it. EVAL_CATEGORIES below is the knob.
# ══════════════════════════════════════════════════════════════════════════════

# The namespace every eval and export output hangs off. Per-rung results land under
# <SAGE_OUTPUT_DIR>/<EXPERIMENT>-ckpt_<N>/ (a FLAT suffix — sage cannot take a "/"
# in an experiment name, see build.yaml), per-rung CSVs under
# <SAGE_RESULTS_DIR>/<EXPERIMENT>/ckpt_<N>-sage.csv, and the roll-up at
# <SAGE_RESULTS_DIR>/<EXPERIMENT>/combined.csv.
#
# Deliberately NOT derived from RUN_NAME: the eval results are meant to be
# comparable across builds and to sit beside the recorded baseline rows in the same
# sage tree, whereas RUN_NAME namespaces this build's checkpoints. Change it per
# arm if you run more than one -- an lmbda 0.5 arm, say.
EXPERIMENT: "distill-350m-onpolicy-c2000-1node"

# Which evaluations run. A comma-separated list of CATEGORIES from EVAL_CATALOG
# below, plus the pseudo-category `bfcl` for the 27th (which is its own target
# shape, in its own image, and so is not in the catalog).
#
# All six is the default because the whole point is comparability with the recorded
# after-SFT row, which is a full-suite row. Trim it for a cheaper pass — e.g.
#   --param EVAL_CATEGORIES=bfcl,math,general
# is ~11 evals per rung instead of 27. The build drops the exporters for an eval
# kind that was not selected, so a trimmed run still produces combined.csv.
EVAL_CATEGORIES: "code,general,math,safety,multilingual,bfcl"

# ─── sage eval defaults (overridden per eval in EVAL_CATALOG) ─────────────────
# These are full-eval's values, not this pipeline's. SAGE_MAX_LENGTH 4096 is
# emphatically NOT the same quantity as MAX_LENGTH 8192 above: that one is the
# corpus/trainer/transfer-eval token budget and moving it changes what was trained;
# this one is the benchmark harness's generation cap, and it has to match what the
# baseline row was measured at or the comparison is invalid. Likewise
# SAGE_BATCH_SIZE vs EVAL_BATCH_SIZE, which belongs to distill-eval.
SAGE_BATCH_SIZE: 10
SAGE_MAX_LENGTH: 4096
SAGE_NUM_GPUS: 1
# Roots for raw eval output and for the exported CSVs. Shared sage/bfcl trees, so
# these rows sit beside every other model's rows.
SAGE_OUTPUT_DIR: "/proj/granite-build/g4os/sage"
SAGE_RESULTS_DIR: "/proj/granite-build/g4os/sage/results"
BFCL_OUTPUT_DIR: "/proj/granite-build/g4os/bfcl"
BFCL_RESULTS_DIR: "/proj/granite-build/g4os/bfcl/results"
# The BigCodeBench execution service, and the one prerequisite this build cannot
# satisfy itself: olmes-bigcodebench sends generated code there to be run. Start
# bcb-server first and pass its URL, or that eval fails on every rung.
#
#   gb build start -f recipes/granite4-350m/lsf/bcb-server/build.yaml --space <space>
#   gb build start -f .../distill-onpolicy-checkpoint-eval-1node/build.yaml --space <space> \
#     --param OE_EVAL_BCB_API_URL=http://<host>:7860/evaluate/
#
# The default below is the address a previous run used; it is almost certainly stale.
OE_EVAL_BCB_API_URL: "http://p2-r24-n4.bluevela.rmf.ibm.com:7860/evaluate/"
# Post-processing filter for the BFCL CSV. Empty = every row.
BFCL_FILTER: ""

# ─── eval + export resources ─────────────────────────────────────────────────
# PREEMPTABLE for both, and safe for both: the evals are short, idempotent and
# independently retryable, and the exporters are CPU-only minutes. Training and the
# server stay on `normal` (QUEUE above) so neither can be preempted mid-run.
EVAL_QUEUE: "preemptable"
EVAL_ACCELERATORS: "H100:1"
EVAL_MEMORY: 256
EXPORT_QUEUE: "preemptable"
# The sage exporter's row-assembly stack. granite4-instruct is what the baseline
# rows were exported with; changing it changes which metrics appear as rows.
EXPORT_STACK: "granite4-instruct"

# ─── The catalog: 26 sage evals ──────────────────────────────────────────────
# Transcribed from recipes/granite4-350m/lsf/rl-checkpoint-eval/eval-catalog.yaml,
# which was itself transcribed once from sft-eval-full-dataset. Keep it in sync if
# that suite changes.
#
# WHY THIS IS DATA AND NOT 26 TARGETS. full-eval writes these out as 26 hand-written
# targets; rl-checkpoint-eval keeps them in a separate catalog file and generates its
# build with a 930-line Python script. Neither shape survives a 26 x 9 cross product
# that also has to carry this recipe's corpus front end. So the per-eval facts live
# here as parameters and build.yaml's nested Jinja loop emits the cross product — the
# CLI hands Jinja the parsed parameters dict, so a list of mappings iterates directly,
# and the recipe stays a single `gb build start` with no generation step.
#
# Per entry:
#   name            target name is eval-<name>-ck<N>; must be unique.
#   category        selected by EVAL_CATEGORIES.
#   gb_script       the sage script to run.
#   image_id        sage image the eval needs (olmes / code / safety / multilingual).
#   output_subpath  appended under <SAGE_OUTPUT_DIR>/<experiment>/ for the declared
#                   output URI. Must match where the sage script actually writes.
#   batch_size      optional; defaults to SAGE_BATCH_SIZE.
#   max_length      optional; defaults to SAGE_MAX_LENGTH.
#   extra_env       optional; exported into the eval's environment.
#   needs_bcb_url   optional; emits OE_EVAL_BCB_API_URL into extra_env. This cannot
#                   be expressed as a value here — a $${...} marker inside a
#                   parameter VALUE is emitted literally, never re-rendered — so the
#                   template writes the marker and this flag selects it.
EVAL_CATALOG:
  # ─── Code (9) ────────────────────────────────────────────────
  - name: olmes-cruxeval
    category: code
    gb_script: code_olmes_cruxeval_slim.sh
    image_id: docker:us.icr.io/cil15-shared-registry/sage-py311-olmes:0.025
    output_subpath: "code/olmes-instruct/cruxeval_output"
  - name: olmes-bigcodebench
    category: code
    gb_script: code_olmes_bigcodebench_slim.sh
    image_id: docker:us.icr.io/cil15-shared-registry/sage-py311-olmes:0.025
    output_subpath: "code/olmes-instruct/bigcodebench::tulu"
    needs_bcb_url: true
  - name: evalplus-humaneval
    category: code
    gb_script: code_evalplus_humaneval_slim.sh
    image_id: docker:us.icr.io/cil15-shared-registry/sage-py311-code:0.025
    output_subpath: code/evalplus/humaneval
  - name: evalplus-mbpp
    category: code
    gb_script: code_evalplus_mbpp_slim.sh
    image_id: docker:us.icr.io/cil15-shared-registry/sage-py311-code:0.025
    output_subpath: code/evalplus/mbpp
  # The MultiPL-E family shares one script and selects the language through
  # the environment, at max_length 512 rather than the default.
  - name: multiple-sh
    category: code
    gb_script: code_multiple_slim.sh
    image_id: docker:us.icr.io/cil15-shared-registry/sage-py311-code:0.025
    output_subpath: code/multiple/sh
    max_length: 512
    extra_env: {MULTIPLE_LANG: "sh", MAX_LENGTH: "512"}
  - name: multiple-cpp
    category: code
    gb_script: code_multiple_slim.sh
    image_id: docker:us.icr.io/cil15-shared-registry/sage-py311-code:0.025
    output_subpath: code/multiple/cpp
    max_length: 512
    extra_env: {MULTIPLE_LANG: "cpp", MAX_LENGTH: "512"}
  - name: multiple-java
    category: code
    gb_script: code_multiple_slim.sh
    image_id: docker:us.icr.io/cil15-shared-registry/sage-py311-code:0.025
    output_subpath: code/multiple/java
    max_length: 512
    extra_env: {MULTIPLE_LANG: "java", MAX_LENGTH: "512"}
  - name: multiple-js
    category: code
    gb_script: code_multiple_slim.sh
    image_id: docker:us.icr.io/cil15-shared-registry/sage-py311-code:0.025
    output_subpath: code/multiple/js
    max_length: 512
    extra_env: {MULTIPLE_LANG: "js", MAX_LENGTH: "512"}
  - name: multiple-rs
    category: code
    gb_script: code_multiple_slim.sh
    image_id: docker:us.icr.io/cil15-shared-registry/sage-py311-code:0.025
    output_subpath: code/multiple/rs
