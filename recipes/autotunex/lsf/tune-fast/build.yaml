                          strategy: choice
                          for_tuner: true
                          description: Gradient accumulation steps
                        per_device_train_batch_size:
                          type: int
                          values:
                          - 2
                          - 4
                          - 8
                          default: 4
                          max_val: 32
                          min_val: 1
                          options:
                          - choice
                          - uniform
