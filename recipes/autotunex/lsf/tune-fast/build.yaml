                          - uniform
                          strategy: choice
                          for_tuner: true
                          description: PPO clipping range for the policy loss
                        entropy_coef:
                          type: float
                          values:
                          - 0.001
                          - 0.01
                          - 0.1
                          default: 0.01
                          max_val: 1
                          min_val: 0
                          options:
                          - choice
                          - uniform
                          strategy: choice
                          for_tuner: true
                          description: Entropy penalty coefficient
                        learning_rate:
                          type: float
                          values:
                          - 1.0e-06
                          - 5.0e-06
                          - 1.0e-05
                          default: 1.0e-06
                          max_val: 0.001
                          min_val: 1.0e-07
                          options:
                          - choice
                          - uniform
                          - loguniform
                          strategy: choice
                          for_tuner: true
                          description: Learning rate for the actor
                        gradient_accumulation_steps:
                          type: int
                          values:
                          - 1
                          - 2
                          - 4
                          default: 1
                          max_val: 16
                          min_val: 1
                          options:
                          - choice
                          - uniform
                          strategy: choice
                          for_tuner: true
                          description: Gradient accumulation steps
                        per_device_train_batch_size:
                          type: int
                          values:
                          - 2
                          - 4
                          - 8
                          default: 4
                          max_val: 32
                          min_val: 1
                          options:
                          - choice
                          - uniform
                          strategy: choice
                          for_tuner: true
