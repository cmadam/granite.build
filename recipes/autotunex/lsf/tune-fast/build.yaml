granite.build:
  name: autotunex-granite-4.0-350m-lora-fast
  # Fast AutoTuneX sweep on BlueVela (LSF via SkyPilot).
  #
  # Same machinery as recipes/autotunex/lsf/tune-4gpu — same step, same
  # `skypilot:` config block, same fm-tune entry point — but sized so a real
  # sweep finishes in minutes and needs one credential instead of three. Use
  # tune-4gpu when the question is "does the AutoTuneX-generated build run
  # here"; use this one when iterating on the plumbing around it.
  #
  # Differences from tune-4gpu, all of them deliberate:
  #
  #   * no `inputs:`   fm-tune bundles the dataset (datasets/finance_train.jsonl,
  #                    1833 lines), and start_command runs in the clone root, so
  #                    a repo-relative path needs no artifact at all. This drops
  #                    the hf:// input, the hfpull step, and $HF_TOKEN.
  #   * model          granite-4.0-350m from /proj instead of
  #                    ibm-granite/granite-4.1-3b from HF — no download, and far
  #                    less compute per trial.
  #   * search space   three `default:` values changed (see below). Everything
  #                    else in the 787-line space is untouched, so a diff against
  #                    tune-4gpu/build.yaml shows exactly three lines.
  #   * 2 GPUs         two trials run concurrently rather than four-way on four
  #                    GPUs; wall clock is one trial either way.
  #   * no .sqsh       the image is pulled cold, relying on the LSF provisioner's
  #                    one-hour container-readiness window (which exists to cover
  #                    exactly this enroot import). Pre-seeding is the fallback if
  #                    that turns out not to be enough, not a precondition.
  #
  # $GITHUB_IBM_PAT is the only external credential required.
  targets:
    autotunex-tune:
      environment_uri: space://environments/skypilot/lsf/ibm-bluevela
      outputs:
        # Same pattern as recipes/granite4-350m/lsf/sft-10k-test: the URI is
        # templated against the NEWARTIFACT payload, so {{ binding.path }} is the
        # run-specific dir the step actually wrote, not its parent. The step
        # exports OUTPUT_PATH under $GB_BUILD_WORKDIR, i.e. on /proj, so the
        # results are on the shared FS and env:// push is a no-op.
        checkpoint:
          uri: "env://{{ binding.path }}"
          type: model
      steps:
        - step_uri: space://steps/autotunex-tune
          config:
            poll_interval_seconds: $${POLL_INTERVAL}
            log_retrieval_interval_seconds: $${POLL_INTERVAL}
            custom_code_config:
              github_url: $${REPO}
              github_ref: "$${REPO_REF}"
              setup_command: >-
                git checkout $${REPO_REF} &&
                pip install -e ".[full]" &&
                pip list &&
                nvidia-smi
              # Unchanged from tune-4gpu except for the dataset paths (now
              # repo-relative, so no {{ bindings.* }}) and the model. $OUTPUT_PATH
              # is exported by the step; single-$ forms survive gbcli's parameter
              # pass and are expanded by the shell on the compute node.
              start_command: >-
                export CUDA_HOME=$${CUDA_HOME} &&
                export LOG_PATH=$OUTPUT_PATH &&
                python main.py
                --config_file /tmp/autotunex-lora-fast.yaml
                --train_file $${TRAIN_FILE}
                --validation_file $${VALIDATION_FILE}
                --model_name_or_path $${MODEL}
                --tuning_algo $${TUNING_ALGO}
                --run_name $${RUN_NAME}
                --output_dir $OUTPUT_PATH
                --output_model_name $${RUN_NAME}
                --cleanup
                --save_history
                --job_id $${JOB_ID}
                $${AUTOTUNEX_ARGS}
              dir_to_save: "$OUTPUT_PATH"
            skypilot:
              image: "$${IMAGE}"
              additional_files:
                # The AutoTuneX search space with three `default:` values changed
                # for turnaround. autotune/config.py:111-121 reads
                # cfg[key].get("default") for every key, so `default` is the knob:
                #
                #   tune_config.num_samples            8 -> 2   (trials)
                #   tune_config.max_concurrent_trials  4 -> 2   (fits 2 GPUs)
                #   training_config.num_train_epochs   2 -> 1
                #
                # Already short enough to leave alone: hpo_num_epochs 1,
                # hpo_dataset_percentage 0.1, num_gpus_per_trial 1,
                # max_length 1024.
                /tmp/autotunex-lora-fast.yaml: |
                  tune_config:
                    scheduler:
                      type: str
                      values:
                      - fifo
                      - hyperband
                      default: fifo
                      max_val: null
                      min_val: null
                      required: true
                      description: The scheduler used by ray/tune to schedult the trials
                    search_alg:
                      type: str
                      values:
                      - lds
                      - hyperopt
                      - random
                      - bayesopt
                      - bohb
                      default: lds
                      max_val: null
                      min_val: null
                      required: true
                      description: Search algorithm used by ray/tune to explore the hyperparameter search
                        space
                    num_samples:
                      type: int
                      values: null
                      default: 2
                      max_val: 10000
                      min_val: 1
                      required: true
                      description: Number of samples from the hyperparameter search space
                    time_budget_s:
                      type: int
                      values: null
                      default: null
                      max_val: 1209600
                      min_val: 60
                      required: false
                      description: Maximum allowed time for completing the hyperparameter search.
                    max_discrepancy:
                      type: int
                      values: null
                      default: 6
                      max_val: 100
                      min_val: 1
                      required: true
                      search_alg:
                      - lds
                      description: Maximum discrepancy value for LDS
                    max_concurrent_trials:
                      type: int
                      values: null
                      default: 2
                      max_val: 8
                      min_val: 1
                      required: true
                      description: Maximum number of trials running concurrently
                  tuners_config:
                    lora:
                      title: LoRA
                      tuner_name: tuner.lora
                      description: Low rank adapter fine-tuning
                      hyperparams:
                        r:
                          type: int
                          values:
                          - 8
                          - 16
                          - 32
                          - 64
                          default: 64
                          max_val: 64
                          min_val: 0
                          options:
                          - choice
                          - uniform
                          strategy: choice
                          for_tuner: true
                          description: Rank size
                        bias:
                          type: str
                          values:
                          - none
                          default: none
                          max_val: null
                          min_val: null
                          options:
                          - choice
                          strategy: choice
                          for_tuner: true
                          description: Bias value
                        alpha_ratio:
                          type: float
                          values:
                          - 0.5
                          - 1
                          - 2
                          default: 2
                          max_val: 10
                          min_val: 0.1
                          options:
                          - choice
                          - uniform
                          strategy: choice
                          for_tuner: false
                          description: scaling ratio
                        lora_dropout:
                          type: float
                          values:
                          - 0
                          - 0.05
                          - 0.1
                          default: 0.05
                          max_val: 0.1
                          min_val: 0
                          options:
                          - choice
                          - uniform
                          strategy: choice
                          for_tuner: true
                          description: dropout rate
                        warmup_ratio:
                          type: float
                          values:
                          - 0.1
                          - 0.2
                          default: 0.1
                          max_val: 1
                          min_val: 0
                          options:
                          - choice
                          - uniform
                          strategy: choice
                          for_tuner: false
                          description: Warmup ratio
                        learning_rate:
                          type: float
                          values:
                          - 1.0e-06
                          - 3.0e-06
                          - 5.0e-06
                          default: 1.0e-06
                          max_val: 5.0e-05
                          min_val: 1.0e-06
                          options:
                          - choice
                          - uniform
                          - loguniform
                          strategy: choice
                          for_tuner: false
                          description: Learning rate
                        lr_scheduler_type:
                          type: str
                          values:
                          - cosine
                          - linear
                          default: cosine
                          max_val: null
                          min_val: null
                          options:
                          - choice
                          strategy: choice
                          for_tuner: false
                          description: Learning rate scheduler type
                        gradient_accumulation_steps:
                          type: int
                          values:
                          - 1
                          - 2
                          - 4
                          - 8
                          - 16
                          default: 1
                          max_val: 50
                          min_val: 1
                          options:
                          - choice
                          - uniform
                          strategy: choice
                          for_tuner: false
                          description: Gradient accumulation steps
                        per_device_train_batch_size:
                          type: int
                          values:
                          - 1
                          - 2
                          - 4
                          - 8
                          - 16
                          - 32
                          default: 16
                          max_val: 128
                          min_val: 1
                          options:
                          - choice
                          - uniform
                          strategy: choice
                          for_tuner: false
                          description: Batch size used during training
                      dataset_type: dataset_type_a
                  training_config:
                    max_length:
                      type: int
                      values: null
                      default: 1024
                      max_val: 128000
                      min_val: 1
                      required: true
                      description: Maximum sequence length used by the tokenizer (input + output)
                    ds_strategy:
                      type: str
                      values:
                      - zero3_cpu
                      - zero2_cpu
                      - zero2_gpu
                      - zero1_gpu
                      default: zero3_cpu
                      max_val: null
                      min_val: null
                      required: true
                      description: Deepspeed strategy used for distributed training
                    rl_algorithm:
                      type: str
                      values:
                      - none
                      - dpo
                      - kto
                      default: none
                      max_val: null
                      min_val: null
                      required: true
                      description: Offline RL algorithm used for training
                    fsdp_strategy:
                      type: str
                      values:
                      - full_shard
                      - shard_grad_op
                      - no_shard
                      - hybrid_shard
                      - hybrid_shard_zero2
                      default: full_shard
                      max_val: null
                      min_val: null
                      required: true
                      description: FSDP strategy used for distributed training
                    hpo_num_epochs:
                      type: int
                      values: null
                      default: 1
                      max_val: 10
                      min_val: 1
                      required: true
                      description: Number of training epochs used for HPO
                    num_train_epochs:
                      type: int
                      values: null
                      default: 1
                      max_val: 100
                      min_val: 1
                      required: true
                      description: Number of training epochs
                    tuning_algorithm:
                      type: str
                      values:
                      - none
                      - sft
                      - lora
                      - alora
                      - loha
                      - lokr
                      default: lora
                      max_val: null
                      min_val: null
                      required: true
                      description: Finetuning algorithm used for training
                    num_gpus_per_trial:
                      type: int
                      values: null
                      default: 1
                      max_val: 8
                      min_val: 1
                      required: true
                      description: GPUs per trial (worker)
                    use_flash_attention:
                      type: str
                      values:
                      - eager
                      - flash_attention_2
                      default: flash_attention_2
                      max_val: null
                      min_val: null
                      description: Use flash attention (eager or flash_attention_2)
                    train_implementation:
                      type: str
                      values:
                      - deepspeed
                      - fsdp
                      default: deepspeed
                      max_val: null
                      min_val: null
                      required: true
                      description: Distributed training implementation (DeepSpeed or FSDP)
                    hpo_dataset_percentage:
                      type: float
                      values: null
                      default: 0.1
                      max_val: 1
                      min_val: 0.01
                      required: true
                      description: Percentage training data used for HPO
                  tuners_rl_config:
                    dpo:
                      title: DPO
                      tuner_name: tuner.dpo
                      description: Direct Preference Optimization (DPO)
                      hyperparams:
                        beta:
                          type: float
                          values:
                          - 0.1
                          - 1
                          - 10
                          default: 1
                          max_val: 10
                          min_val: 0.1
                          options:
                          - choice
                          - uniform
                          strategy: choice
                          for_tuner: true
                          description: DPO beta value
                        loss_type:
                          type: str
                          values:
                          - sigmoid
                          - hinge
                          - ipo
                          - kto_pair
                          default: sigmoid
                          max_val: null
                          min_val: null
                          options:
                          - choice
                          strategy: choice
                          for_tuner: true
                          description: DPO loss type
                      dataset_type: dataset_type_b
                    kto:
                      title: KTO
                      tuner_name: tuner.kto
                      description: Kahneman-Tversky Optimization (KTO)
                      hyperparams:
                        desirable_weight:
                          type: float
                          values:
                          - 1
                          - 5
                          - 10
                          default: 1
                          max_val: 10
                          min_val: 0.1
                          options:
                          - choice
                          - uniform
                          strategy: choice
                          for_tuner: true
                          description: KTO desirable weight
                        undesirable_weight:
                          type: float
                          values:
                          - 1
                          - 5
                          - 10
                          default: 1
                          max_val: 10
                          min_val: 0.1
                          options:
                          - choice
                          - uniform
                          strategy: choice
                          for_tuner: true
                          description: KTO undesirable weight
                      dataset_type: dataset_type_c
                    ppo:
                      title: PPO
                      tuner_name: tuner.ppo
                      description: Proximal Policy Optimization (PPO)
                      hyperparams:
                        kl_coef:
                          type: float
                          values:
                          - 0.001
                          - 0.002
                          - 0.003
                          default: 0.001
                          max_val: 1
                          min_val: 0
                          options:
                          - choice
                          - uniform
                          strategy: choice
                          for_tuner: true
                          description: KL penalty coefficient controlling divergence from reference
                            policy
                        clip_range:
                          type: float
                          values:
                          - 0.1
                          - 0.2
                          - 0.3
                          default: 0.2
                          max_val: 1
                          min_val: 0.01
                          options:
