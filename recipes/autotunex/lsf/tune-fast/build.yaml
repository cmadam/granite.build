                          - 5.0e-06
                          - 1.0e-05
                          default: 1.0e-06
                          max_val: 0.001
                          min_val: 1.0e-07
                          options:
                          - choice
                          - uniform
                          - loguniform
                          strategy: choice
                          for_tuner: true
                          description: Learning rate for the actor
                        overlong_buffer_len:
                          type: int
                          values:
                          - 128
                          - 256
                          - 512
                          default: 256
                          max_val: 1024
                          min_val: 64
                          options:
                          - choice
                          - uniform
                          strategy: choice
                          for_tuner: true
                          description: Buffer length for DAPO overlong penalty
                        rollout_temperature:
                          type: float
                          values:
                          - 0.7
                          - 1
                          - 1.2
                          default: 1
                          max_val: 2
                          min_val: 0
                          options:
                          - choice
                          - uniform
                          strategy: choice
                          for_tuner: true
                          description: Temperature for vLLM generation during rollout
                        overlong_penalty_factor:
                          type: float
                          values:
                          - 0.5
                          - 1
                          - 2
                          default: 1
                          max_val: 5
