                          description: KL penalty coefficient (typically 0 for DAPO)
                        rollout_n:
                          type: int
                          values:
                          - 8
                          - 16
                          - 32
                          default: 16
                          max_val: 64
                          min_val: 1
                          options:
                          - choice
                          - uniform
                          strategy: choice
                          for_tuner: true
