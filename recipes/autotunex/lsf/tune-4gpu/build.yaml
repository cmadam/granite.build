                    reward_model_path:
                      type: str
                      values: null
                      default: null
                      max_val: null
                      min_val: null
                      description: Path to a learned reward model (for verl online RL)
                    max_response_length:
                      type: int
                      values: null
                      default: 512
                      max_val: 128000
                      min_val: 1
