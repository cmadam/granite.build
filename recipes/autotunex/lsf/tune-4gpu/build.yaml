            compute_config:
              # Verbatim from the generated k8s build. On LSF only
              # num_cpus_per_node is consumed (as a cpus floor);
              # num_gpus_per_node is documentation, and total_memory_per_node is
              # skipped because bare HPC schedulers don't track memory as
              # consumable — it is requested via resources.memory below.
              num_gpus_per_node: 4
              num_cpus_per_node: $${NUM_CPUS}
              num_nodes: 1
              total_memory_per_node: "256Gi"
            launcher_config:
              resources:
                accelerators: "$${ACCELERATORS}"
                cluster: "$${CLUSTER}"
                zone: "$${QUEUE}"
                memory: "$${MEMORY}"
